# Experimental self-managed Linux setup. Read docs/features/gvisor-start-source.md.
clusterName: gvisor-trial
capabilities:
  runtimeObservability: enable
configurations:
  otelUrl: http://otel-collector.monitoring.svc:4317
nodeAgent:
  image:
    # Replace with an image you have verified. v0.3.310 and later contain start
    # collection (node-agent#1069); stop observations and health reports need
    # v0.3.325 or later (node-agent#1072, #1094).
    repository: your-registry.example/node-agent
    tag: your-tested-gvisor-tag
  nodeSelector:
    kubernetes.io/os: linux
    kubescape.io/gvisor-start-ready: "true"
  gVisorStart:
    enabled: true
    socketDirectory: /run/kubescape/gvisor
    # K3s example. Use /run/containerd/containerd.sock for standard containerd.
    runtimeEndpoint: /run/k3s/containerd/containerd.sock
    runtimeHandler: runsc
    # Requires an image containing node-agent#1094 and the stop trace points in
    # docs/features/gvisor-start-source.md. Leave false for start-only collection.
    stopObservations: false
