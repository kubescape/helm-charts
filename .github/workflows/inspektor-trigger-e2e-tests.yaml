name: inspektor-e2e-tests

on:
  push:
    branches:
      - inspektor

permissions: read-all

jobs:
  call-e2e-tests:
    permissions:
      contents: read
      checks: write # Pass through to the reusable JUnit report job.
    uses: ./.github/workflows/relevancy-e2e-test.yaml
    with:
      BRANCH: "inspektor"
    secrets: inherit
 