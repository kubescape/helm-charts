name: inspektor-e2e-tests

on:
  push:
    branches:
      - inspektor

permissions: read-all

jobs:
  call-e2e-tests:
    # The reusable workflow requests read-all; omitted scopes would deny the call.
    permissions:
      actions: read
      artifact-metadata: read
      attestations: read
      checks: write
      code-quality: read
      contents: read
      deployments: read
      discussions: read
      drives: read
      issues: read
      models: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: read
      vulnerability-alerts: read
    uses: ./.github/workflows/relevancy-e2e-test.yaml
    with:
      BRANCH: "inspektor"
    secrets: inherit
 