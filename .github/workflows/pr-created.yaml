name: pull_request_created
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '*.md'
      - '.github/workflows/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  pr-created:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0

      # Keep rendering and snapshot generation on the same immutable test image.
      - name: Run Helm Unittests
        run: docker run --rm --name unittest --volume "$(pwd)":/apps helmunittest/helm-unittest@sha256:28ea86c3e0b07f501f0c2e9c08b9f41e240f4a4b571cb5106b36cf0f0607e989 charts/kubescape-operator/
