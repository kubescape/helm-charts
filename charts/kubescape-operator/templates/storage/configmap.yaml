{{- $components := fromYaml (include "components" .) }}
{{- $configurations := fromYaml (include "configurations" .) }}
  {{- if $components.storage.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.storage.name }}
  namespace: {{ .Values.ksNamespace }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.storage.name "tier" .Values.global.namespaceTier) | nindent 4 }}
    kubescape.io/tier: "core"
data:
  config.json: |
    {
      "cleanupInterval": "{{ .Values.storage.cleanupInterval }}",
      {{- if .Values.storage.disableVirtualCRDs }}
      "disableVirtualCRDs": true,
      {{- else }}
      "disableVirtualCRDs": {{ not $configurations.virtualCrds }},
      {{- end }}
      "disableSeccompProfileEndpoint": {{ eq .Values.capabilities.seccompProfileBackend "crd" }},
      "excludeJsonPaths": {{ .Values.configurations.excludeJsonPaths | toJson }},
      "defaultQueueLength": {{ .Values.storage.defaultQueueLength }},
      "defaultWorkerCount": {{ .Values.storage.defaultWorkerCount }},
      "defaultMaxObjectSize": {{ .Values.storage.defaultMaxObjectSize }},
      "maxContainerProfileSize": {{ .Values.storage.maxContainerProfileSize }},
      {{- if (.Values.storage.mcp).enabled }}
      "mcp": {"enabled": true},
      {{- end }}
      "queueManagerEnabled": {{ .Values.storage.queueManagerEnabled }},
      "kindQueues": {{ .Values.storage.kindQueues | toJson }},
      {{- if hasKey .Values.storage "singleWriterEnabled" }}
      "singleWriterEnabled": {{ .Values.storage.singleWriterEnabled }},
      {{- end }}
      {{- if .Values.storage.poolTimeout }}
      "poolTimeout": "{{ .Values.storage.poolTimeout }}",
      {{- end }}
      {{- if .Values.storage.sqliteBusyTimeout }}
      "sqliteBusyTimeout": "{{ .Values.storage.sqliteBusyTimeout }}",
      {{- end }}
      {{- if .Values.storage.containerProfileSqliteBackend }}
      {{- if .Values.storage.containerProfileMigrationDryRun }}
      {{- fail "storage.containerProfileMigrationDryRun cannot be combined with storage.containerProfileSqliteBackend: the dry run is taken before the backend is turned on" }}
      {{- end }}
      {{- if and (hasKey .Values.storage "singleWriterEnabled") (not .Values.storage.singleWriterEnabled) }}
      {{- fail "storage.containerProfileSqliteBackend requires storage.singleWriterEnabled" }}
      {{- end }}
      "containerProfileSqliteBackend": true,
      {{- end }}
      {{- if .Values.storage.containerProfileMigrationDryRun }}
      "containerProfileMigrationDryRun": true,
      {{- end }}
      {{- if .Values.storage.mtls.enabled }}
      "tlsClientCaFile": "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt",
      "tlsServerCertFile": "/etc/storage-ca-certificates/tls.crt",
      "tlsServerKeyFile": "/etc/storage-ca-certificates/tls.key",
      {{- end }}
      "serverBindPort": "{{ .Values.storage.serverPort }}"
    }
{{- end }}
