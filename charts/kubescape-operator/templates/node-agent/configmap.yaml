{{- $filters := fromYaml (include "namespaceFilters.config" .) }}
{{- $components := fromYaml (include "components" .) }}
{{- $configurations := fromYaml (include "configurations" .) }}
{{- $gates := (fromYaml (include "capabilities.gates" .)).effective }}
{{- include "gvisorStart.validate" . }}
{{- if $components.nodeAgent.enabled }}
{{/* validate that either alertCRD.scopeClustered or alertCRD.scopeNamespaced defined when the capability enabled */}}
{{- if eq .Values.capabilities.runtimeDetection "enable" }}
{{- if and (not .Values.alertCRD.scopeNamespaced) (not .Values.alertCRD.scopeClustered) }}
{{- fail "Runtime detection is enabled, but the Runtime rule alert binding CRD is not configured to be created neither in the cluster scope nor namespace scope (set alertCRD.scopeClustered or alertCRD.scopeNamepaced)" }}
{{- end }}
{{- end }}
{{- $hostSensorExcludedSensors := .Values.nodeAgent.config.hostSensor.excludedSensors }}
{{- if kindIs "invalid" $hostSensorExcludedSensors }}
{{- $hostSensorExcludedSensors = list }}
{{- else if not (kindIs "slice" $hostSensorExcludedSensors) }}
{{- fail "nodeAgent.config.hostSensor.excludedSensors must be a list" }}
{{- end }}
{{- /* node-agent refuses to start with an unknown name, so reject it here; these are the kinds of the host-data CRDs in templates/node-agent-crds */}}
{{- $hostSensorKinds := list "OsReleaseFile" "KernelVersion" "LinuxSecurityHardeningStatus" "OpenPortsList" "LinuxKernelVariables" "KubeletInfo" "KubeProxyInfo" "ControlPlaneInfo" "CloudProviderInfo" "CNIInfo" }}
{{- range $hostSensorExcludedSensors }}
{{- if not (has . $hostSensorKinds) }}
{{- fail (printf "nodeAgent.config.hostSensor.excludedSensors: unknown host sensor %q; valid sensors: %s" (toString .) (join ", " $hostSensorKinds)) }}
{{- end }}
{{- end }}
{{- if and $hostSensorExcludedSensors (hasKey (default dict .Values.nodeAgent.config.extra) "hostSensorExcludedSensors") }}
{{- fail "configure hostSensorExcludedSensors through nodeAgent.config.hostSensor.excludedSensors, not nodeAgent.config.extra.hostSensorExcludedSensors" }}
{{- end }}
{{- $sandboxPolicy := default dict .Values.nodeAgent.sandboxPolicy }}
{{- if $sandboxPolicy.enabled }}
{{- $image := toString (default "" $sandboxPolicy.image) }}
{{- if or (not (trim $image)) (ne (trim $image) $image) }}
{{- fail "nodeAgent.sandboxPolicy.image is required when nodeAgent.sandboxPolicy.enabled is true (node-agent refuses to start without sandboxPolicyImage)" }}
{{- end }}
{{- range $name := list "containerdSocket" "controlRoot" }}
{{- $path := toString (default "" (get $sandboxPolicy $name)) }}
{{- if or (not (hasPrefix "/" $path)) (eq $path "/") (ne (trim $path) $path) }}
{{- fail (printf "nodeAgent.sandboxPolicy.%s must be an absolute path other than \"/\", got %q" $name $path) }}
{{- end }}
{{- end }}
{{- range $name := list "privilegeImage" "networkImage" "fileImage" }}
{{- $sectionImage := get $sandboxPolicy $name }}
{{- if not (or (kindIs "invalid" $sectionImage) (kindIs "string" $sectionImage)) }}
{{- fail (printf "nodeAgent.sandboxPolicy.%s must be a string (empty turns the section off)" $name) }}
{{- else if ne (trim (toString (default "" $sectionImage))) (toString (default "" $sectionImage)) }}
{{- fail (printf "nodeAgent.sandboxPolicy.%s must not have surrounding whitespace, got %q" $name $sectionImage) }}
{{- end }}
{{- end }}
{{- if not (or (kindIs "invalid" $sandboxPolicy.runtimeHelperExemption) (kindIs "bool" $sandboxPolicy.runtimeHelperExemption)) }}
{{- fail "nodeAgent.sandboxPolicy.runtimeHelperExemption must be true or false" }}
{{- end }}
{{- $maxOwners := default 0 $sandboxPolicy.maxOwners }}
{{- if not (or (kindIs "int" $maxOwners) (kindIs "int64" $maxOwners) (kindIs "float64" $maxOwners)) }}
{{- fail "nodeAgent.sandboxPolicy.maxOwners must be a non-negative integer (0 keeps node-agent's default)" }}
{{- else if or (lt (float64 $maxOwners) 0.0) (ne (float64 $maxOwners) (float64 (int64 $maxOwners))) }}
{{- fail "nodeAgent.sandboxPolicy.maxOwners must be a non-negative integer (0 keeps node-agent's default)" }}
{{- end }}
{{- range $key := list "sandboxPolicyEnabled" "sandboxPolicyImage" "sandboxPolicyPrivilegeImage" "sandboxPolicyNetworkImage" "sandboxPolicyFileImage" "sandboxPolicyRuntimeHelperExemption" "sandboxPolicyContainerdSocket" "sandboxPolicyControlRoot" "sandboxPolicyMaxOwners" }}
{{- if hasKey (default dict $.Values.nodeAgent.config.extra) $key }}
{{- fail (printf "configure %s through nodeAgent.sandboxPolicy, not nodeAgent.config.extra.%s" $key $key) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nodeAgent.name }}
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.nodeAgent.name "tier" .Values.global.namespaceTier) | nindent 4 }}
    kubescape.io/tier: "core"
data:
  config.json: |
    {
        {{- $extra := default dict .Values.nodeAgent.config.extra }}
        {{- if $configurations.backendStorageEnabled }}
        "backendStorageEnabled": true,
        {{- end }}
        {{- if .Values.nodeAgent.gVisorStart.enabled }}
        "gVisorStart": {
          "enabled": true,
          "socketPath": {{ printf "%s/events.sock" .Values.nodeAgent.gVisorStart.socketDirectory | toJson }},
          "runtimeEndpoint": {{ .Values.nodeAgent.gVisorStart.runtimeEndpoint | toJson }},
          {{- if .Values.nodeAgent.gVisorStart.stopObservations }}
          "stopObservations": true,
          {{- end }}
          "runtimeHandler": {{ .Values.nodeAgent.gVisorStart.runtimeHandler | toJson }}
        },
        {{- end }}
        {{- if $sandboxPolicy.enabled }}
        "sandboxPolicyEnabled": true,
        "sandboxPolicyImage": {{ $sandboxPolicy.image | toJson }},
        "sandboxPolicyPrivilegeImage": {{ default "" $sandboxPolicy.privilegeImage | toJson }},
        "sandboxPolicyNetworkImage": {{ default "" $sandboxPolicy.networkImage | toJson }},
        "sandboxPolicyFileImage": {{ default "" $sandboxPolicy.fileImage | toJson }},
        "sandboxPolicyRuntimeHelperExemption": {{ default false $sandboxPolicy.runtimeHelperExemption }},
        "sandboxPolicyContainerdSocket": {{ $sandboxPolicy.containerdSocket | toJson }},
        "sandboxPolicyControlRoot": {{ $sandboxPolicy.controlRoot | toJson }},
        {{- if $sandboxPolicy.maxOwners }}
        "sandboxPolicyMaxOwners": {{ $sandboxPolicy.maxOwners | int64 }},
        {{- end }}
        {{- end }}
        "applicationProfileServiceEnabled": {{ or $configurations.runtimeObservability (eq .Values.capabilities.relevancy "enable") }},
        "prometheusExporterEnabled": {{ eq .Values.nodeAgent.config.prometheusExporter "enable" }},
        "runtimeDetectionEnabled": {{ eq .Values.capabilities.runtimeDetection "enable" }},
        "httpDetectionEnabled": {{ $gates.httpDetectionEnabled }},
        "networkServiceEnabled": {{ eq .Values.capabilities.networkPolicyService "enable" }},
        "malwareDetectionEnabled": {{ $gates.malwareDetectionEnabled }},
        "hostSensorEnabled": {{ .Values.nodeAgent.config.hostSensor.enabled }},
        "hostSensorInterval": "{{ .Values.nodeAgent.config.hostSensor.interval }}",
        {{- with $hostSensorExcludedSensors }}
        "hostSensorExcludedSensors": {{ . | toJson }},
        {{- end }}
        "nodeProfileServiceEnabled": {{ $gates.nodeProfileServiceEnabled }},
        "networkStreamingEnabled": {{ $gates.networkStreamingEnabled }},
        "maxImageSize": {{ .Values.kubevuln.config.maxImageSize }},
        "maxSBOMSize": {{ .Values.kubevuln.config.maxSBOMSize }},
        "maxTsProfileSize": {{ .Values.nodeAgent.config.maxTsProfileSize }},
        "sbomGenerationEnabled": {{ eq .Values.capabilities.nodeSbomGeneration "enable" }},
        "enableEmbeddedSBOMs": {{ eq .Values.capabilities.scanEmbeddedSBOMs "enable" }},
        "seccompServiceEnabled": {{ eq .Values.capabilities.seccompProfileService "enable" }},
        "seccompProfileBackend": "{{ .Values.capabilities.seccompProfileBackend }}",
        "sandboxSeccompEnabled": {{ eq .Values.capabilities.sandboxSeccomp "enable" }},
        "initialDelay": "{{ .Values.nodeAgent.config.learningPeriod }}",
        "updateDataPeriod": "{{ .Values.nodeAgent.config.updatePeriod }}",
        "nodeProfileInterval": "{{ .Values.nodeAgent.config.nodeProfileInterval }}",
        "networkStreamingInterval": "{{ .Values.nodeAgent.config.networkStreamingInterval }}",
        "maxSniffingTimePerContainer": "{{ .Values.nodeAgent.config.maxLearningPeriod }}",
        {{- if $filters.enabled }}
        "namespaceFilterFile": {{ "/etc/namespace-filters/namespaceFilters.json" | quote }},
        {{- else if ne .Values.includeNamespaces "" }}
        "includeNamespaces": "{{ .Values.includeNamespaces }}",
        {{- else if ne .Values.excludeNamespaces "" }}
        "excludeNamespaces": "{{ .Values.excludeNamespaces }}",
        {{- end }}
        "excludeLabels": {{- .Values.excludeLabels | toJson }},
        "exporters": {
          {{- if $components.synchronizer.enabled }}
          "httpExporterConfig": {{- .Values.nodeAgent.config.httpExporterConfig | toJson }},
          {{- end }}
          "alertManagerExporterUrls": {{- .Values.nodeAgent.config.alertManagerExporterUrls | toJson }},
          "stdoutExporter": {{- .Values.nodeAgent.config.stdoutExporter }},
          "syslogExporterURL": "{{- .Values.nodeAgent.config.syslogExporterURL }}"
        },
        "excludeJsonPaths": {{- .Values.configurations.excludeJsonPaths | toJson }},
        "ruleCooldown": {
            "ruleCooldownDuration": "{{ .Values.nodeAgent.config.ruleCooldown.ruleCooldownDuration }}",
            "ruleCooldownAfterCount": {{ .Values.nodeAgent.config.ruleCooldown.ruleCooldownAfterCount }},
            "ruleCooldownOnProfileFailure": {{ .Values.nodeAgent.config.ruleCooldown.ruleCooldownOnProfileFailure }},
            "ruleCooldownMaxSize": {{ .Values.nodeAgent.config.ruleCooldown.ruleCooldownMaxSize }}
        },
        "alertDeduplication": {
            "bypass": {{ .Values.nodeAgent.config.alertDeduplication.bypass }}
        },
        "dCapSys": {{ eq .Values.nodeAgent.config.tracers.capSys "disable" }},
        "dDns": {{ eq .Values.nodeAgent.config.tracers.dns "disable" }},
        "dExec": {{ eq .Values.nodeAgent.config.tracers.exec "disable" }},
        "dExit": {{ eq .Values.nodeAgent.config.tracers.exit "disable" }},
        "dFork": {{ eq .Values.nodeAgent.config.tracers.fork "disable" }},
        "dHardlink": {{ eq .Values.nodeAgent.config.tracers.hardlink "disable" }},
        "dHttp": {{ eq .Values.nodeAgent.config.tracers.http "disable" }},
        "dIouring": {{ eq .Values.nodeAgent.config.tracers.iouring "disable" }},
        "dNetwork": {{ eq .Values.nodeAgent.config.tracers.network "disable" }},
        "dOpen": {{ eq .Values.nodeAgent.config.tracers.open "disable" }},
        "dPtrace": {{ eq .Values.nodeAgent.config.tracers.ptrace "disable" }},
        "dRandomx": {{ eq .Values.nodeAgent.config.tracers.randomx "disable" }},
        "dSeccomp": {{ eq .Values.nodeAgent.config.tracers.seccomp "disable" }},
        "dSsh": {{ eq .Values.nodeAgent.config.tracers.ssh "disable" }},
        "dSymlink": {{ eq .Values.nodeAgent.config.tracers.symlink "disable" }},
        "dKmod": {{ eq .Values.nodeAgent.config.tracers.kmod "disable" }},
        "dUnshare": {{ eq .Values.nodeAgent.config.tracers.unshare "disable" }},
        "dBpf": {{ eq .Values.nodeAgent.config.tracers.bpf "disable" }},
        "dTop": {{ eq .Values.nodeAgent.config.tracers.top "disable" }}
        {{- /*
        nodeAgent.config.extra is an unvalidated passthrough intended for downstream/private
        consumers to set fields not exposed by this public chart (e.g. hostNetworkSensorEnabled).
        It is emitted at the end so any explicit overrides take precedence without requiring
        a fragile, hardcoded list of chart-managed keys.
        */}}
        {{- range $k, $v := $extra }}
        {{- if ne $k "backendStorageEnabled" }},
        {{ $k | toJson }}: {{ $v | toJson }}
        {{- end }}
        {{- end }}
    }
{{- end }}
