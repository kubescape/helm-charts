{{- if and .Values.alertCRD.installDefault }}
apiVersion: kubescape.io/v1
kind: Rules
metadata:
  name: default-rules
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.nodeAgent.name "tier" .Values.global.namespaceTier) | nindent 4 }}
spec:
  rules:
      - name: "Unexpected process launched"
        enabled: true
        id: "R0001"
        description: "Detects unexpected process launches that are not in the baseline"
        expressions:
          message: "'Unexpected process launched: ' + event.comm + ' with PID ' + string(event.pid)"
          uniqueId: "event.comm + '_' + event.exepath"
          ruleExpression:
            - eventType: "exec"
              expression: "!ap.was_executed(event.containerId, (event.exepath != \"\" ? event.exepath : parse.get_exec_path(event.args, event.comm)))"
        profileDependency: 0
        profileDataRequired:
          execs: all
        severity: 1
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0002"
        mitreTechnique: "T1059"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "anomaly"
          - "process"
          - "exec"
          - "applicationprofile"
      - name: "Files Access Anomalies in container"
        enabled: false
        id: "R0002"
        description: "Detects unexpected file access that is not in the baseline"
        expressions:
          message: "'Unexpected file access detected: ' + event.comm + ' with PID ' + string(event.pid) + ' to ' + event.path"
          uniqueId: "event.comm + '_' + event.path"
          ruleExpression:
            - eventType: "open"
              expression: >
                (event.path.startsWith('/etc/') ||
                event.path.startsWith('/var/log/') ||
                event.path.startsWith('/var/run/') ||
                event.path.startsWith('/run/') ||
                event.path.startsWith('/var/spool/cron/') ||
                event.path.startsWith('/var/www/') ||
                event.path.startsWith('/var/lib/') ||
                event.path.startsWith('/opt/') ||
                event.path.startsWith('/usr/local/') ||
                event.path.startsWith('/app/') ||
                event.path == '/.dockerenv' ||
                event.path == '/proc/self/environ')
                &&
                !(event.path.startsWith('/run/secrets/kubernetes.io/serviceaccount') ||
                  event.path.startsWith('/var/run/secrets/kubernetes.io/serviceaccount') ||
                  event.path.startsWith('/tmp'))
                &&
                !ap.was_path_opened(event.containerId, event.path)
        profileDependency: 0
        profileDataRequired:
          opens:
            - prefix: "/etc/"
            - prefix: "/var/log/"
            - prefix: "/var/run/"
            - prefix: "/run/"
            - prefix: "/var/spool/cron/"
            - prefix: "/var/www/"
            - prefix: "/var/lib/"
            - prefix: "/opt/"
            - prefix: "/usr/local/"
            - prefix: "/app/"
            - exact: "/.dockerenv"
            - exact: "/proc/self/environ"
        severity: 1
        supportPolicy: false
        isTriggerAlert: false
        mitreTactic: "TA0009"
        mitreTechnique: "T1005"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "anomaly"
          - "file"
          - "open"
          - "applicationprofile"
      - name: "Syscalls Anomalies in container"
        enabled: true
        id: "R0003"
        description: "Detects unexpected system calls that are not whitelisted by application profile"
        expressions:
          message: "'Unexpected system call detected: ' + event.syscallName + ' with PID ' + string(event.pid)"
          uniqueId: "event.syscallName"
          ruleExpression:
            - eventType: "syscall"
              expression: "!ap.was_syscall_used(event.containerId, event.syscallName)"
        profileDependency: 0
        profileDataRequired:
          syscalls: all
        severity: 1
        supportPolicy: false
        isTriggerAlert: false
        mitreTactic: "TA0002"
        mitreTechnique: "T1059"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "anomaly"
          - "syscall"
          - "applicationprofile"
      - name: "Linux Capabilities Anomalies in container"
        enabled: true
        id: "R0004"
        description: "Detects unexpected capabilities that are not whitelisted by application profile"
        expressions:
          message: "'Unexpected capability used: ' + event.capName + ' in syscall ' + event.syscallName + ' with PID ' + string(event.pid)"
          uniqueId: "event.comm + '_' + event.capName"
          ruleExpression:
            - eventType: "capabilities"
              expression: "!ap.was_capability_used(event.containerId, event.capName)"
        profileDependency: 0
        profileDataRequired:
          capabilities: all
        severity: 1
        supportPolicy: false
        isTriggerAlert: false
        mitreTactic: "TA0002"
        mitreTechnique: "T1059"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "anomaly"
          - "capabilities"
          - "applicationprofile"
      - name: "DNS Anomalies in container"
        enabled: true
        id: "R0005"
        description: "Detecting unexpected domain requests that are not whitelisted by application profile."
        expressions:
          message: "'Unexpected domain communication: ' + event.name + ' from: ' + event.containerName"
          uniqueId: "event.comm + '_' + event.name"
          ruleExpression:
            - eventType: "dns"
              expression: "!event.name.endsWith('.svc.cluster.local.') && !nn.is_domain_in_egress(event.containerId, event.name)"
        profileDependency: 0
        profileDataRequired:
          egressDomains: all
        severity: 1
        supportPolicy: false
        isTriggerAlert: false
        mitreTactic: "TA0011"
        mitreTechnique: "T1071.004"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "dns"
          - "anomaly"
          - "networkprofile"
      - name: "Unexpected service account token access"
        enabled: true
        id: "R0006"
        description: "Detecting unexpected access to service account token."
        expressions:
          message: "'Unexpected access to service account token: ' + event.path + ' with flags: ' + event.flags.join(',')"
          uniqueId: "event.comm"
          ruleExpression:
            - eventType: "open"
              expression: >
                ((event.path.startsWith('/run/secrets/kubernetes.io/serviceaccount') && event.path.endsWith('/token')) || 
                 (event.path.startsWith('/var/run/secrets/kubernetes.io/serviceaccount') && event.path.endsWith('/token')) ||
                 (event.path.startsWith('/run/secrets/eks.amazonaws.com/serviceaccount') && event.path.endsWith('/token')) ||
                 (event.path.startsWith('/var/run/secrets/eks.amazonaws.com/serviceaccount') && event.path.endsWith('/token'))) &&
                !ap.was_path_opened_with_suffix(event.containerId, '/token')
        state:
          includePrefixes:
            - /run/secrets
            - /var/run/secrets
        profileDependency: 0
        profileDataRequired:
          opens:
            - suffix: "/token"
        severity: 5
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0006"
        mitreTechnique: "T1528"
        tags:
          - "context:kubernetes"
          - "anomaly"
          - "serviceaccount"
          - "applicationprofile"
      - name: "Workload uses Kubernetes API unexpectedly"
        enabled: true
        id: "R0007"
        description: "Detecting execution of kubernetes client"
        expressions:
          message: "eventType == 'exec' ? 'Kubernetes client (' + event.comm + ') was executed with PID ' + string(event.pid) : 'Network connection to Kubernetes API server from container ' + event.containerName"
          uniqueId: "eventType == 'exec' ? 'exec_' + event.comm : 'network_' + event.dstAddr"
          ruleExpression:
            - eventType: "exec"
              expression: "(event.comm == 'kubectl' || event.exepath.endsWith('/kubectl')) && !ap.was_executed(event.containerId, (event.exepath != \"\" ? event.exepath : parse.get_exec_path(event.args, event.comm)))"
            - eventType: "network"
              expression: "event.pktType == 'OUTGOING' && k8s.is_api_server_address(event.dstAddr) && !nn.was_address_in_egress(event.containerId, event.dstAddr)"
        profileDependency: 0
        profileDataRequired:
          execs: all
          egressAddresses: all
        severity: 5 # Medium
        supportPolicy: false
        isTriggerAlert: false
        mitreTactic: "TA0008"
        mitreTechnique: "T1210"
        tags:
          - "context:kubernetes"
          - "exec"
          - "network"
          - "anomaly"
          - "applicationprofile"
      - name: "Read Environment Variables from procfs"
        enabled: true
        id: "R0008"
        description: "Detecting reading environment variables from procfs."
        expressions:
          message: "'Reading environment variables from procfs: ' + event.path + ' by process ' + event.comm"
          uniqueId: "event.comm"
          ruleExpression:
            - eventType: "open"
              expression: >
                event.path.startsWith('/proc/') && 
                event.path.endsWith('/environ') &&
                !ap.was_path_opened_with_suffix(event.containerId, '/environ')
        state:
          includePrefixes:
            - /proc
        profileDependency: 0 # Required
        profileDataRequired:
          opens:
            - suffix: "/environ"
        severity: 5 # Medium
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0006"
        mitreTechnique: "T1552.001"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "anomaly"
          - "procfs"
          - "environment"
          - "applicationprofile"
      - name: "eBPF Program Load"
        enabled: true
        id: "R0009"
        description: "Detecting eBPF program load."
        expressions:
          message: "'bpf program load system call (bpf) was called by process (' + event.comm + ') with command (BPF_PROG_LOAD)'"
          uniqueId: "event.comm + '_' + 'bpf' + '_' + string(event.cmd)"
          ruleExpression:
            - eventType: "bpf"
              expression: "event.cmd == uint(5) && !ap.was_syscall_used(event.containerId, 'bpf')"
        profileDependency: 1
        profileDataRequired:
          syscalls:
            - exact: "bpf"
        severity: 5
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0005"
        mitreTechnique: "T1218"
        tags:
          - "context:kubernetes"
          - "context:host"
          - "bpf"
          - "ebpf"
          - "applicationprofile"
      - name: "Unexpected Sensitive File Access"
        enabled: true
        id: "R0010"
        description: "Detecting access to sensitive files."
        expressions:
          message: "'Unexpected sensitive file access: ' + event.path + ' by process ' + event.comm"
          uniqueId: "event.comm + '_' + event.path"
          ruleExpression:
            - eventType: "open"
              expression: "event.path.startsWith('/etc/shadow') && !ap.was_path_opened(event.containerId, event.path)"
        profileDependency: 1
        profileDataRequired:
          opens:
            - prefix: "/etc/shadow"
        severity: 5
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0006"
        mitreTechnique: "T1005"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "context:host"
          - "files"
          - "anomaly"
          - "applicationprofile"
      - name: "Unexpected Egress Network Traffic"
        enabled: false
        id: "R0011"
        description: "Detecting unexpected egress network traffic that is not whitelisted by application profile."
        expressions:
          message: "'Unexpected egress network communication to: ' + event.dstAddr + ':' + string(event.dstPort) + ' using ' + event.proto + ' from: ' + event.containerName"
          uniqueId: "event.dstAddr + '_' + string(event.dstPort) + '_' + event.proto"
          ruleExpression:
            - eventType: "network"
              expression: "event.pktType == 'OUTGOING' && !net.is_private_ip(event.dstAddr) && !nn.was_address_in_egress(event.containerId, event.dstAddr)"
        profileDependency: 0
        profileDataRequired:
          egressAddresses: all
        severity: 5 # Medium
        supportPolicy: false
        isTriggerAlert: false
        mitreTactic: "TA0010"
        mitreTechnique: "T1041"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "whitelisted"
          - "network"
          - "anomaly"
          - "networkprofile"
      - name: "Unexpected process arguments"
        enabled: true
        id: "R0040"
        description: "Detects an exec event whose path IS in the application profile but whose argv vector does not match any recorded argv pattern for that path. Consumes ap.was_executed_with_args, which walks the ExecsByPath projection surface and delegates argv comparison to dynamicpathdetector.MatchExecArgs (storage). Stays silent when the path is unknown (R0001 covers that case) and when the argv vector matches any recorded pattern (including the trailing zero-or-more form and the single-arg form); a '*' in a recorded arg is a literal character, not a wildcard."
        expressions:
          message: "'Unexpected process arguments: ' + event.comm + ' with PID ' + string(event.pid) + ' argv=' + event.args.map(a, string(a)).join(' ')"
          uniqueId: "event.comm + '_' + event.exepath + '_' + event.args.map(a, string(a)).join(' ')"
          ruleExpression:
            - eventType: "exec"
              expression: "ap.was_executed(event.containerId, parse.get_exec_path(event.args, event.comm, event.exepath)) && !ap.was_executed_with_args(event.containerId, parse.get_exec_path(event.args, event.comm, event.exepath), event.args)"
        profileDependency: 0
        profileDataRequired:
          execs: all
        severity: 3
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0002"
        mitreTechnique: "T1059"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "anomaly"
          - "process"
          - "exec"
          - "applicationprofile"
      - name: "Process Executed from /dev/shm"
        enabled: true
        id: "R1000"
        description: "Detecting exec calls whose executable path or working directory is under /dev/shm, a world-writable memory-backed (tmpfs) directory."
        expressions:
          message: "'Process executed from /dev/shm: ' + event.exepath + ' in directory ' + event.cwd"
          uniqueId: "event.comm + '_' + event.exepath + '_' + event.pcomm"
          ruleExpression:
            - eventType: "exec"
              expression: >
                (event.exepath == '/dev/shm' || event.exepath.startsWith('/dev/shm/')) ||
                (event.cwd == '/dev/shm' || event.cwd.startsWith('/dev/shm/')) ||
                (event.args.size() > 0 && (event.args[0] == '/dev/shm' || event.args[0].startsWith('/dev/shm/')))
        profileDependency: 2
        severity: 8
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0002"
        mitreTechnique: "T1059"
        tags:
          - "context:kubernetes"
          - "context:host"
          - "exec"
          - "signature"
          - "malicious"
      - name: "Drifted process executed"
        enabled: true
        id: "R1001"
        description: "Detecting exec calls of binaries that are not included in the base image"
        expressions:
          message: "'Process (' + event.comm + ') was executed and is not part of the image'"
          uniqueId: "event.comm + '_' + event.exepath + '_' + event.pcomm"
          ruleExpression:
            - eventType: "exec"
              expression: >
                (event.upperlayer == true ||
                 event.pupperlayer == true) &&
                !ap.was_executed(event.containerId, (event.exepath != "" ? event.exepath : parse.get_exec_path(event.args, event.comm)))
        profileDependency: 1
        profileDataRequired:
          execs: all
        severity: 8
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0005"
        mitreTechnique: "T1036"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "exec"
          - "malicious"
          - "binary"
          - "base image"
          - "applicationprofile"
      - name: "Process tries to load a kernel module"
        enabled: true
        id: "R1002"
        description: "Detecting Kernel Module Load."
        expressions:
          message: "'Kernel module (' + event.module + ') loading attempt with syscall (' + event.syscallName + ') was called by process (' + event.comm + ')'"
          uniqueId: "event.comm + '_' + event.syscallName + '_' + event.module"
          ruleExpression:
            - eventType: "kmod"
              expression: "event.syscallName == 'init_module' || event.syscallName == 'finit_module'"
        profileDependency: 2
        severity: 10
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0005"
        mitreTechnique: "T1547.006"
        tags:
          - "context:kubernetes"
          - "context:host"
          - "kmod"
          - "kernel"
          - "module"
          - "load"
      - name: "SSH Connection to Unexpected Destination on Non-Standard Port"
        enabled: false
        id: "R1003"
        description: "Detecting an SSH connection to a non-standard port where the destination address is not in the container's learned egress baseline."
        expressions:
          message: "'SSH connection to unexpected destination on non-standard port: ' + event.dstIp + ':' + string(dyn(event.dstPort))"
          uniqueId: "event.comm + '_' + event.dstIp + '_' + string(dyn(event.dstPort))"
          ruleExpression:
            - eventType: "ssh"
              expression: "dyn(event.srcPort) >= 32768 && dyn(event.srcPort) <= 60999 && !(dyn(event.dstPort) in [22, 2022]) && !nn.was_address_in_egress(event.containerId, event.dstIp)"
        profileDependency: 1
        profileDataRequired:
          egressAddresses: all
        severity: 5
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0008"
        mitreTechnique: "T1021.001"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "ssh"
          - "connection"
          - "port"
          - "malicious"
          - "networkprofile"
      - name: "Process executed from mount"
        enabled: true
        id: "R1004"
        description: "Detecting exec calls from mounted paths."
        expressions:
          message: "'Process (' + event.comm + ') was executed from a mounted path'"
          uniqueId: "event.comm"
          ruleExpression:
            - eventType: "exec"
              expression: "!ap.was_executed(event.containerId, (event.exepath != \"\" ? event.exepath : parse.get_exec_path(event.args, event.comm))) && k8s.get_container_mount_paths(event.namespace, event.podName, event.containerName).exists(mount, event.exepath.startsWith(mount) || (event.exepath != \"\" ? event.exepath : parse.get_exec_path(event.args, event.comm)).startsWith(mount))"
        profileDependency: 1
        profileDataRequired:
          execs: all
        severity: 5
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0002"
        mitreTechnique: "T1059"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "exec"
          - "mount"
          - "applicationprofile"
      - name: "Fileless execution detected"
        enabled: true
        id: "R1005"
        description: "Detecting Fileless Execution"
        expressions:
          message: '''Fileless execution detected: exec call "'' + event.comm + ''" runs from a memory-backed source (memfd / /proc/self/fd)'''
          uniqueId: "event.comm + '_' + event.exepath + '_' + event.pcomm"
          ruleExpression:
            - eventType: "exec"
              expression: "event.exepath.contains('memfd') || event.exepath.startsWith('/proc/self/fd') || event.exepath.matches('/proc/[0-9]+/fd/[0-9]+')"
        profileDependency: 2
        severity: 8
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0005"
        mitreTechnique: "T1055"
        tags:
          - "context:kubernetes"
          - "context:host"
          - "fileless"
          - "execution"
          - "malicious"
      - name: "Unexpected unshare Syscall in Container"
        enabled: true
        id: "R1006"
        description: "Detecting use of the unshare system call (a namespace-manipulation capability that can be used to escape a container) by a non-runc process, where it was not seen in the container's application-profile baseline."
        expressions:
          message: "'Unshare system call (unshare) was called by process (' + event.comm + ')'"
          uniqueId: "event.comm + '_' + 'unshare'"
          ruleExpression:
            - eventType: "unshare"
              expression: "event.pcomm != 'runc' && !ap.was_syscall_used(event.containerId, 'unshare')"
        profileDependency: 1
        profileDataRequired:
          syscalls:
            - exact: "unshare"
        severity: 5
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0004"
        mitreTechnique: "T1611"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "unshare"
          - "escape"
          - "unshare"
          - "anomaly"
          - "applicationprofile"
      - name: "Crypto miner launched"
        enabled: true
        id: "R1007"
        description: "Detecting XMR Crypto Miners by randomx algorithm usage."
        expressions:
          message: "'XMR Crypto Miner process: (' + event.exepath + ') executed'"
          uniqueId: "event.exepath + '_' + event.comm"
          ruleExpression:
            - eventType: "randomx"
              expression: "true"
        profileDependency: 2
        severity: 10
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0040"
        mitreTechnique: "T1496"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "crypto"
          - "miners"
          - "malicious"
      - name: "Crypto Mining Domain Communication"
        enabled: true
        id: "R1008"
        description: "Detecting Crypto miners communication by domain"
        expressions:
          message: "'Communication with a known crypto mining domain: ' + event.name"
          uniqueId: "event.name + '_' + event.comm"
          ruleExpression:
            - eventType: "dns"
              expression: "event.name in ['2cryptocalc.com.', '2miners.com.', 'antpool.com.', 'asia1.ethpool.org.', 'bohemianpool.com.', 'botbox.dev.', 'btm.antpool.com.', 'c3pool.com.', 'c4pool.org.', 'ca.minexmr.com.', 'cn.stratum.slushpool.com.', 'dash.antpool.com.', 'data.miningpoolstats.stream.', 'de.minexmr.com.', 'eth-ar.dwarfpool.com.', 'eth-asia.dwarfpool.com.', 'eth-asia1.nanopool.org.', 'eth-au.dwarfpool.com.', 'eth-au1.nanopool.org.', 'eth-br.dwarfpool.com.', 'eth-cn.dwarfpool.com.', 'eth-cn2.dwarfpool.com.', 'eth-eu.dwarfpool.com.', 'eth-eu1.nanopool.org.', 'eth-eu2.nanopool.org.', 'eth-hk.dwarfpool.com.', 'eth-jp1.nanopool.org.', 'eth-ru.dwarfpool.com.', 'eth-ru2.dwarfpool.com.', 'eth-sg.dwarfpool.com.', 'eth-us-east1.nanopool.org.', 'eth-us-west1.nanopool.org.', 'eth-us.dwarfpool.com.', 'eth-us2.dwarfpool.com.', 'eth.antpool.com.', 'eu.stratum.slushpool.com.', 'eu1.ethermine.org.', 'eu1.ethpool.org.', 'fastpool.xyz.', 'fr.minexmr.com.', 'kriptokyng.com.', 'mine.moneropool.com.', 'mine.xmrpool.net.', 'miningmadness.com.', 'monero.cedric-crispin.com.', 'monero.crypto-pool.fr.', 'monero.fairhash.org.', 'monero.hashvault.pro.', 'monero.herominers.com.', 'monerod.org.', 'monerohash.com.', 'moneroocean.stream.', 'monerop.com.', 'multi-pools.com.', 'p2pool.io.', 'pool.kryptex.com.', 'pool.minexmr.com.', 'pool.monero.hashvault.pro.', 'pool.rplant.xyz.', 'pool.supportxmr.com.', 'pool.xmr.pt.', 'prohashing.com.', 'rx.unmineable.com.', 'sg.minexmr.com.', 'sg.stratum.slushpool.com.', 'skypool.org.', 'solo-xmr.2miners.com.', 'ss.antpool.com.', 'stratum-btm.antpool.com.', 'stratum-dash.antpool.com.', 'stratum-eth.antpool.com.', 'stratum-ltc.antpool.com.', 'stratum-xmc.antpool.com.', 'stratum-zec.antpool.com.', 'stratum.antpool.com.', 'supportxmr.com.', 'trustpool.cc.', 'us-east.stratum.slushpool.com.', 'us1.ethermine.org.', 'us1.ethpool.org.', 'us2.ethermine.org.', 'us2.ethpool.org.', 'web.xmrpool.eu.', 'www.domajorpool.com.', 'www.dxpool.com.', 'www.mining-dutch.nl.', 'xmc.antpool.com.', 'xmr-asia1.nanopool.org.', 'xmr-au1.nanopool.org.', 'xmr-eu1.nanopool.org.', 'xmr-eu2.nanopool.org.', 'xmr-jp1.nanopool.org.', 'xmr-us-east1.nanopool.org.', 'xmr-us-west1.nanopool.org.', 'xmr.2miners.com.', 'xmr.crypto-pool.fr.', 'xmr.gntl.uk.', 'xmr.nanopool.org.', 'xmr.pool-pay.com.', 'xmr.pool.minergate.com.', 'xmr.solopool.org.', 'xmr.volt-mine.com.', 'xmr.zeropool.io.', 'zec.antpool.com.', 'zergpool.com.', 'auto.c3pool.org.', 'us.monero.herominers.com.', 'xmr.kryptex.network.']"
        profileDependency: 2
        severity: 10
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0011"
        mitreTechnique: "T1071.004"
        tags:
          - "context:kubernetes"
          - "context:host"
          - "network"
          - "crypto"
          - "miners"
          - "malicious"
          - "dns"
      - name: "Crypto Mining Related Port Communication"
        enabled: true
        id: "R1009"
        description: "Detecting Crypto Miners by suspicious port usage."
        expressions:
          message: "'Detected crypto mining related port communication on port ' + string(event.dstPort) + ' to ' + event.dstAddr + ' with protocol ' + event.proto"
          uniqueId: "event.comm + '_' + string(event.dstPort)"
          ruleExpression:
            - eventType: "network"
              expression: "event.proto == 'TCP' && event.pktType == 'OUTGOING' && event.dstPort in [3333, 45700] && !nn.was_address_in_egress(event.containerId, event.dstAddr)"
        state:
          ports:
            - 3333
            - 45700
        profileDependency: 1
        profileDataRequired:
          egressAddresses: all
        severity: 3
        supportPolicy: false
        isTriggerAlert: false
        mitreTactic: "TA0011"
        mitreTechnique: "T1071"
        tags:
          - "context:kubernetes"
          - "context:host"
          - "network"
          - "crypto"
          - "miners"
          - "malicious"
          - "networkprofile"
      - name: "Soft link created over sensitive file"
        enabled: true
        id: "R1010"
        description: "Detects symlink creation over sensitive files"
        expressions:
          message: "'Symlink created over sensitive file: ' + event.oldPath + ' -> ' + event.newPath"
          uniqueId: "event.comm + '_' + event.oldPath"
          ruleExpression:
            - eventType: "symlink"
              expression: "(event.oldPath.startsWith('/etc/shadow') || event.oldPath.startsWith('/etc/sudoers')) && !ap.was_path_opened(event.containerId, event.oldPath)"
        profileDependency: 1
        profileDataRequired:
          opens:
            - prefix: "/etc/shadow"
            - prefix: "/etc/sudoers"
        severity: 5
        supportPolicy: true
        isTriggerAlert: true
        mitreTactic: "TA0006"
        mitreTechnique: "T1005"
        tags:
          - "context:kubernetes"
          - "context:host"
          - "anomaly"
          - "symlink"
          - "applicationprofile"
      - name: "ld_preload Mechanism Use or ld.so.preload Modification"
        enabled: false
        id: "R1011"
        description: "Detecting use of the LD_PRELOAD/LD_LIBRARY_PATH dynamic-linker hook mechanism, or an unexpected write to /etc/ld.so.preload relative to the container's application-profile baseline."
        expressions:
          message: "eventType == 'exec' ? 'Process (' + event.comm + ') is using a dynamic linker hook: ' + process.get_ld_hook_var(event.pid) : 'The dynamic linker configuration file (' + event.path + ') was modified by process (' + event.comm + ')'"
          uniqueId: "eventType == 'exec' ? 'exec_' + event.comm : 'open_' + event.path"
          ruleExpression:
            - eventType: "exec"
              expression: "event.comm != 'java' && event.containerName != 'matlab' && process.get_ld_hook_var(event.pid) != ''"
            - eventType: "open"
              expression: "event.path == '/etc/ld.so.preload' && has(event.flagsRaw) && event.flagsRaw != 0"
        profileDependency: 1
        profileDataRequired:
          opens:
            - exact: "/etc/ld.so.preload"
        severity: 5
        supportPolicy: true
        isTriggerAlert: true
        mitreTactic: "TA0005"
        mitreTechnique: "T1574.006"
        tags:
          - "context:kubernetes"
          - "exec"
          - "malicious"
          - "applicationprofile"
      - name: "Hard link created over sensitive file"
        enabled: true
        id: "R1012"
        description: "Detecting hardlink creation over sensitive files."
        expressions:
          message: "'Hardlink created over sensitive file: ' + event.oldPath + ' - ' + event.newPath"
          uniqueId: "event.comm + '_' + event.oldPath"
          ruleExpression:
            - eventType: "hardlink"
              expression: "(event.oldPath.startsWith('/etc/shadow') || event.oldPath.startsWith('/etc/sudoers')) && !ap.was_path_opened(event.containerId, event.oldPath)"
        profileDependency: 1
        profileDataRequired:
          opens:
            - prefix: "/etc/shadow"
            - prefix: "/etc/sudoers"
        severity: 5
        supportPolicy: true
        isTriggerAlert: true
        mitreTactic: "TA0006"
        mitreTechnique: "T1005"
        tags:
          - "context:kubernetes"
          - "files"
          - "malicious"
          - "applicationprofile"
      - name: "Unexpected Ptrace Syscall Usage"
        enabled: true
        id: "R1015"
        description: "Detecting use of the ptrace syscall that was not seen in the container's application-profile baseline."
        expressions:
          message: "'Unexpected ptrace syscall usage from: ' + event.comm"
          uniqueId: "event.exepath + '_' + event.comm"
          ruleExpression:
            - eventType: "ptrace"
              expression: "true"
        profileDependency: 2
        severity: 5
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0005"
        mitreTechnique: "T1622"
        tags:
          - "context:kubernetes"
          - "context:host"
          - "process"
          - "malicious"
      - name: "Unexpected io_uring Operation Detected"
        enabled: true
        id: "R1030"
        description: "Detects io_uring operations that were not recorded during the initial observation period, indicating potential unauthorized activity."
        expressions:
          message: "'Unexpected io_uring operation detected: (opcode=' + string(event.opcode) + ') flags=0x' + (has(event.flagsRaw) ? string(event.flagsRaw) : '0') + ' in ' + event.comm + '.'"
          uniqueId: "string(event.opcode) + '_' + event.comm"
          ruleExpression:
            - eventType: "iouring"
              expression: "true"
        profileDependency: 0
        profileDataRequired:
          syscalls: all
        severity: 5
        supportPolicy: true
        isTriggerAlert: true
        mitreTactic: "TA0002"
        mitreTechnique: "T1218"
        tags:
          - "context:kubernetes"
          - "context:container"
          - "syscalls"
          - "io_uring"
          - "applicationprofile"
      - name: "Exec to pod"
        enabled: true
        id: "R2000"
        description: "Detects exec operations on pods via the Kubernetes admission webhook (PodExecOptions CONNECT)"
        expressions:
          message: "'Exec to pod: ' + event.Name + ' in namespace ' + event.Namespace + ' by ' + event.UserInfo.Username"
          uniqueId: "event.Namespace + '/' + event.Name"
          ruleExpression:
            - eventType: "k8s-admission"
              expression: 'event.Kind == "PodExecOptions"'
        profileDependency: 2
        severity: 8
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0002"
        mitreTechnique: "T1609"
        tags:
          - "context:kubernetes"
          - "admission"
          - "exec"
      - name: "Port forward to pod"
        enabled: true
        id: "R2001"
        description: "Detects port-forward operations on pods via the Kubernetes admission webhook (PodPortForwardOptions CONNECT)"
        expressions:
          message: "'Port forward to pod: ' + event.Name + ' in namespace ' + event.Namespace + ' by ' + event.UserInfo.Username"
          uniqueId: "event.Namespace + '/' + event.Name"
          ruleExpression:
            - eventType: "k8s-admission"
              expression: 'event.Kind == "PodPortForwardOptions"'
        profileDependency: 2
        severity: 5
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0011"
        mitreTechnique: "T1090"
        tags:
          - "context:kubernetes"
          - "admission"
          - "network"
      - name: "Pod shares host namespace"
        enabled: true
        id: "R2002"
        description: "Detects pod creation with hostPID, hostIPC or hostNetwork enabled, via the Kubernetes admission webhook"
        expressions:
          message: >-
            'Pod shares host namespace (' +
            ["hostPID", "hostIPC", "hostNetwork"].filter(f, f in object.spec && object.spec[f] == true).join(', ') +
            '): ' + event.Namespace + '/' +
            (event.Name != '' ? event.Name : (has(object.metadata.generateName) ? string(object.metadata.generateName) : 'unnamed')) +
            ' by ' + event.UserInfo.Username
          uniqueId: >-
            event.Namespace + '/' +
            (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() > 0
              ? string(object.metadata.ownerReferences[0].kind) + '/' + string(object.metadata.ownerReferences[0].name)
              : (event.Name != '' ? event.Name : (has(object.metadata.generateName) ? string(object.metadata.generateName) : 'unnamed')))
          ruleExpression:
            - eventType: "k8s-admission"
              expression: >-
                event.Kind == "Pod" &&
                event.Operation == "CREATE" &&
                !(event.Namespace in ["kube-system", "kube-public", "kube-node-lease", "kubescape"]) &&
                has(object.spec) &&
                ["hostPID", "hostIPC", "hostNetwork"].exists(f, f in object.spec && object.spec[f] == true)
        profileDependency: 2
        severity: 6
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0004"
        mitreTechnique: "T1611"
        tags:
          - "context:kubernetes"
          - "admission"
          - "container-escape"
          - "host-namespace"
      - name: "Privileged pod created"
        enabled: true
        id: "R2003"
        description: "Detects pod creation where a container runs privileged or adds a host-breaking Linux capability, via the Kubernetes admission webhook"
        expressions:
          message: >-
            'Privileged pod created: ' + event.Namespace + '/' +
            (event.Name != '' ? event.Name : (has(object.metadata.generateName) ? string(object.metadata.generateName) : 'unnamed')) +
            ' by ' + event.UserInfo.Username
          uniqueId: >-
            event.Namespace + '/' +
            (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() > 0
              ? string(object.metadata.ownerReferences[0].kind) + '/' + string(object.metadata.ownerReferences[0].name)
              : (event.Name != '' ? event.Name : (has(object.metadata.generateName) ? string(object.metadata.generateName) : 'unnamed')))
          ruleExpression:
            - eventType: "k8s-admission"
              expression: >-
                event.Kind == "Pod" &&
                event.Operation == "CREATE" &&
                !(event.Namespace in ["kube-system", "kube-public", "kube-node-lease", "kubescape"]) &&
                has(object.spec) && has(object.spec.containers) &&
                (object.spec.containers
                  + (has(object.spec.initContainers) ? object.spec.initContainers : [])
                  + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
                ).exists(c,
                  has(c.securityContext) &&
                  [
                    has(c.securityContext.privileged) && c.securityContext.privileged == true,
                    has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) &&
                      c.securityContext.capabilities.add.exists(cap,
                        cap in ["ALL", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_RAWIO", "SYS_BOOT",
                                "NET_ADMIN", "DAC_READ_SEARCH", "BPF", "PERFMON", "SYS_TIME"])
                  ].exists(b, b)
                )
        profileDependency: 2
        severity: 8
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0004"
        mitreTechnique: "T1611"
        tags:
          - "context:kubernetes"
          - "admission"
          - "container-escape"
          - "privileged"
          - "capabilities"
      - name: "Pod created with sensitive hostPath volume"
        enabled: true
        id: "R2004"
        description: "Detects pod creation with a hostPath volume on a sensitive host location such as /, /etc, /var/lib/kubelet or the container runtime socket directories, via the Kubernetes admission webhook"
        expressions:
          message: >-
            'Pod created with sensitive hostPath volume: ' +
            object.spec.volumes.filter(v, has(v.hostPath) && has(v.hostPath.path)).map(v, string(v.hostPath.path)).join(', ') +
            ' in ' + event.Namespace + '/' +
            (event.Name != '' ? event.Name : (has(object.metadata.generateName) ? string(object.metadata.generateName) : 'unnamed')) +
            ' by ' + event.UserInfo.Username
          uniqueId: >-
            event.Namespace + '/' +
            (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() > 0
              ? string(object.metadata.ownerReferences[0].kind) + '/' + string(object.metadata.ownerReferences[0].name)
              : (event.Name != '' ? event.Name : (has(object.metadata.generateName) ? string(object.metadata.generateName) : 'unnamed')))
          ruleExpression:
            - eventType: "k8s-admission"
              expression: >-
                event.Kind == "Pod" &&
                event.Operation == "CREATE" &&
                !(event.Namespace in ["kube-system", "kube-public", "kube-node-lease", "kubescape"]) &&
                has(object.spec) && has(object.spec.volumes) &&
                object.spec.volumes
                  .filter(v, has(v.hostPath) && has(v.hostPath.path))
                  .map(v, "/" + string(v.hostPath.path).split("/")
                    .filter(c, c != "" && c != ".")
                    .map(c, c + "/").join(""))
                  .exists(p, [
                    p == "/",
                    ["/etc/", "/proc/", "/root/", "/home/", "/var/lib/kubelet/",
                     "/var/lib/docker/overlay2/", "/var/run/", "/run/"].exists(d, p.startsWith(d))
                  ].exists(b, b))
        profileDependency: 2
        severity: 8
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0004"
        mitreTechnique: "T1611"
        tags:
          - "context:kubernetes"
          - "admission"
          - "container-escape"
          - "hostpath"
      - name: "cluster-admin role bound"
        enabled: true
        id: "R2005"
        description: "Detects a ClusterRoleBinding or RoleBinding that grants the cluster-admin ClusterRole, created or given new subjects, via the Kubernetes admission webhook"
        expressions:
          message: >-
            'cluster-admin granted via ' + event.Kind + ' ' +
            (event.Namespace != '' ? event.Namespace + '/' : '') + event.Name + ' to ' +
            (has(object.subjects)
              ? object.subjects.map(s, string(s.kind) + ':' + (has(s.namespace) ? string(s.namespace) + '/' : '') + string(s.name)).join(', ')
              : 'no subjects') +
            ' by ' + event.UserInfo.Username
          uniqueId: >-
            event.Kind + '/' + (event.Namespace != '' ? event.Namespace + '/' : '') + event.Name
          ruleExpression:
            - eventType: "k8s-admission"
              expression: >-
                [event.Kind == "ClusterRoleBinding", event.Kind == "RoleBinding"].exists(k, k) &&
                event.Operation in ["CREATE", "UPDATE"] &&
                has(object.roleRef) && has(object.roleRef.kind) && has(object.roleRef.name) &&
                object.roleRef.kind == "ClusterRole" &&
                object.roleRef.name == "cluster-admin" &&
                (event.Operation == "CREATE"
                  ? true
                  : (has(object.subjects) ? object.subjects : []) != (has(oldObject.subjects) ? oldObject.subjects : []))
        profileDependency: 2
        severity: 8
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0003"
        mitreTechnique: "T1098.006"
        tags:
          - "context:kubernetes"
          - "admission"
          - "rbac"
          - "privilege-escalation"
      - name: "High privileges role created"
        enabled: true
        id: "R2006"
        description: "Detects a ClusterRole or Role that grants wildcard verbs, escalate/bind/impersonate, write access to RBAC objects, pod exec, token or secret resources, or secret enumeration, created or widened via the Kubernetes admission webhook"
        expressions:
          message: >-
            'High privileges ' + event.Kind + ' ' +
            (event.Namespace != '' ? event.Namespace + '/' : '') + event.Name +
            (event.Operation == "CREATE" ? ' created' : ' updated') +
            ' by ' + event.UserInfo.Username + ' granting ' +
            ["*", "escalate", "bind", "impersonate", "create", "update", "patch", "list", "watch"]
              .filter(v, object.rules.exists(r, has(r.verbs) && v in r.verbs)).join('/') +
            ' on ' +
            ["*", "clusterroles", "clusterrolebindings", "roles", "rolebindings",
             "pods/exec", "pods/attach", "serviceaccounts/token", "nodes/proxy", "secrets",
             "*/exec", "*/attach", "*/token", "*/proxy"]
              .filter(res, object.rules.exists(r, has(r.resources) && res in r.resources)).join(',')
          uniqueId: >-
            event.Kind + '/' + (event.Namespace != '' ? event.Namespace + '/' : '') + event.Name
          ruleExpression:
            - eventType: "k8s-admission"
              expression: >-
                [event.Kind == "ClusterRole", event.Kind == "Role"].exists(k, k) &&
                event.Operation in ["CREATE", "UPDATE"] &&
                event.UserInfo.Username != "system:serviceaccount:kube-system:clusterrole-aggregation-controller" &&
                has(object.rules) &&
                (event.Operation == "CREATE"
                  ? true
                  : object.rules != (has(oldObject.rules) ? oldObject.rules : [])) &&
                object.rules.exists(r,
                  has(r.verbs) && has(r.resources) && has(r.apiGroups) && [
                    r.verbs.exists(v, v in ["*", "escalate", "bind", "impersonate"]),
                    (r.apiGroups.exists(g, g in ["", "*"]) &&
                      r.verbs.exists(v, v in ["create", "update", "patch"]) &&
                      r.resources.exists(res, res in ["*", "pods/exec", "pods/attach", "serviceaccounts/token", "nodes/proxy", "secrets",
                                                      "*/exec", "*/attach", "*/token", "*/proxy"])),
                    (r.apiGroups.exists(g, g in ["rbac.authorization.k8s.io", "*"]) &&
                      r.verbs.exists(v, v in ["create", "update", "patch"]) &&
                      r.resources.exists(res, res in ["*", "clusterroles", "clusterrolebindings", "roles", "rolebindings"])),
                    (r.apiGroups.exists(g, g in ["", "*"]) &&
                      r.verbs.exists(v, v in ["list", "watch"]) &&
                      r.resources.exists(res, res in ["*", "secrets"]))
                  ].exists(b, b))
        profileDependency: 2
        severity: 8
        supportPolicy: false
        isTriggerAlert: true
        mitreTactic: "TA0004"
        mitreTechnique: "T1098.006"
        tags:
          - "context:kubernetes"
          - "admission"
          - "rbac"
          - "privilege-escalation"
{{- end }}
