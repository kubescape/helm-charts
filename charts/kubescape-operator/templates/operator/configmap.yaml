{{- $components := fromYaml (include "components" .) }}
{{- /* node-agent autoscaler floor. Only the chart defaults are raised; any other value is used as is. */}}
{{- $naMinCPU := .Values.nodeAgent.autoscaler.minResources.cpu }}
{{- $naMinMemory := .Values.nodeAgent.autoscaler.minResources.memory }}
{{- $naMinMemoryIsDefault := eq (toString $naMinMemory) "180Mi" }}
{{- if and (eq .Values.capabilities.nodeSbomGeneration "enable") (not $components.sbomScanner.enabled) $naMinMemoryIsDefault }}
  {{- $naMinMemory = "600Mi" }}
{{- end }}
{{- /* Call stacks (private node-agent flag, set as a bool through nodeAgent.config.extra) need about 768Mi and 200m. */}}
{{- $callstackFlag := index (default (dict) .Values.nodeAgent.config.extra) "callstackPipelineEnabled" }}
{{- if and (kindIs "bool" $callstackFlag) $callstackFlag }}
  {{- if $naMinMemoryIsDefault }}
    {{- $naMinMemory = "768Mi" }}
  {{- end }}
  {{- if eq (toString $naMinCPU) "100m" }}
    {{- $naMinCPU = "200m" }}
  {{- end }}
{{- end }}
{{- $excludedControls := list }}
{{- if not (kindIs "invalid" .Values.excludeControls) }}
  {{- if not (kindIs "slice" .Values.excludeControls) }}
    {{- fail "excludeControls must be a list of control identifiers" }}
  {{- end }}
  {{- range .Values.excludeControls }}
    {{- if not (kindIs "string" .) }}
      {{- fail "excludeControls entries must be strings" }}
    {{- end }}
    {{- if eq (trim .) "" }}
      {{- fail "excludeControls contains an empty control identifier" }}
    {{- end }}
    {{- $excludedControls = append $excludedControls (trim .) }}
  {{- end }}
{{- end }}
{{- if $components.operator.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name "tier" .Values.global.namespaceTier) | nindent 4 }}
    kubescape.io/tier: "core"
data:
  config.json: |
    {
        {{- if ne .Values.includeNamespaces "" }}
      "includeNamespaces": "{{ .Values.includeNamespaces }}",
        {{- else if ne .Values.excludeNamespaces "" }}
      "excludeNamespaces": "{{ .Values.excludeNamespaces }}",
        {{- end }}
      {{- if $excludedControls }}
      "excludeControls": {{ $excludedControls | toJson }},
      {{- end }}
      "namespace": "{{ .Values.ksNamespace }}",
      "triggersecurityframework": {{ .Values.operator.triggerSecurityFramework }},
      "podScanGuardTime": "{{ .Values.operator.podScanGuardTime }}",
      "excludeJsonPaths": {{- .Values.configurations.excludeJsonPaths | toJson }},
        {{- if .Values.operator.rulesUpdateConfig }}
      "rulesUpdateConfig": {
        "Enabled": {{ .Values.operator.rulesUpdateConfig.enabled }},
        "Interval": "{{ .Values.operator.rulesUpdateConfig.interval }}",
        "Namespace": "{{ .Values.ksNamespace }}"
      },
        {{- end }}
      {{- if $components.synchronizer.enabled }}
      "httpExporterConfig": {{- .Values.nodeAgent.config.httpExporterConfig | toJson }},
      {{- end }}
      "nodeAgentAutoscaler": {
        "enabled": {{ .Values.nodeAgent.autoscaler.enabled }},
        "nodeGroupLabel": "{{ .Values.nodeAgent.autoscaler.nodeGroupLabel }}",
        "resourcePercentages": {
          "requestCPU": {{ .Values.nodeAgent.autoscaler.resourcePercentages.requestCPU }},
          "requestMemory": {{ .Values.nodeAgent.autoscaler.resourcePercentages.requestMemory }},
          "limitCPU": {{ .Values.nodeAgent.autoscaler.resourcePercentages.limitCPU }},
          "limitMemory": {{ .Values.nodeAgent.autoscaler.resourcePercentages.limitMemory }}
        },
        "minResources": {
          "cpu": "{{ $naMinCPU }}",
          "memory": "{{ $naMinMemory }}"
        },
        "maxResources": {
          "cpu": "{{ .Values.nodeAgent.autoscaler.maxResources.cpu }}",
          "memory": "{{ .Values.nodeAgent.autoscaler.maxResources.memory }}"
        },
        "reconcileInterval": "{{ .Values.nodeAgent.autoscaler.reconcileInterval }}",
        "templatePath": "/etc/templates/daemonset-template.yaml",
        "operatorDeploymentName": "{{ .Values.operator.name }}",
        "goMemLimitPercentage": {{ .Values.nodeAgent.gomemlimitPercentage }},
        "seLinuxType": {{ .Values.nodeAgent.seLinuxType | default "spc_t" | quote }},
        "bottlerocketAutoDetect": {{ .Values.nodeAgent.autoscaler.bottlerocketAutoDetect }}
      }
        {{- $creds := ((.Values.imageScanning).privateRegistries).credentials }}
        {{- if $creds }}
        {{- $cred := index $creds 0 }}
        {{- if $cred.skipTlsVerify }},
      "registryScanningSkipTlsVerify": {{ $cred.skipTlsVerify }}
        {{- end }}
        {{- if $cred.insecure }},
      "registryScanningInsecure": {{ $cred.insecure }}
        {{- end }}
        {{- end }}
    }
{{- end }}
