{{- $components := fromYaml (include "components" .) }}
{{- if and .Values.global.networkPolicy.enabled $components.operator.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name "tier" .Values.global.namespaceTier) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name) | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.global.networkPolicy.createEgressRules }}
    - Egress
  egress:
      # Container registries
    - ports:
        - port: 443
          protocol: TCP
      # Cloud Vendor detection (Instance Metadata Services)
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.169.254/32
    - ports:
        - protocol: TCP
          port: 8080
      to:
        - podSelector:
            matchLabels:
              {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.kubescape.name) | nindent 14 }}
    - ports:
        - protocol: TCP
          port: {{ .Values.kubevuln.service.targetPort }}
      to:
        - podSelector:
            matchLabels:
              {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.kubevuln.name) | nindent 14 }}
{{ tpl (.Files.Get "assets/api-server-egress-rules.yaml") . | indent 4 }}
{{ tpl (.Files.Get "assets/common-egress-rules.yaml") . | indent 4 }}
    {{- if eq (toString .Values.capabilities.sbomExport) "enable" }}
    {{- $dtrack := urlParse .Values.sbomExport.dependencyTrack.url }}
    {{- $dtrackPort := ternary 80 443 (eq $dtrack.scheme "http") }}
    {{- if regexMatch ":[0-9]+$" $dtrack.host }}
    {{- $dtrackPort = int (regexFind "[0-9]+$" $dtrack.host) }}
    {{- end }}
    {{- if ne (int $dtrackPort) 443 }}
    # the SBOM export uploads to Dependency-Track; port 443 is already open above.
    - ports:
        - port: {{ $dtrackPort }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- if $components.synchronizer.enabled }}
    # the operator posts admission alerts and registry-scan statuses to the synchronizer (httpExporterConfig).
    - to:
        - podSelector:
            matchLabels:
              {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.synchronizer.name) | nindent 14 }}
      ports:
        - port: {{ .Values.synchronizer.service.targetPort }}
          protocol: TCP
    {{- end }}
  {{- end }}
  {{- if eq .Values.capabilities.admissionController "enable" }}
  ingress:
    - ports:
      - port: admission-port
        protocol: TCP
  {{- end }}
{{- end }}
