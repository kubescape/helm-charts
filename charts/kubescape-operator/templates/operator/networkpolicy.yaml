{{- $components := fromYaml (include "components" .) }}
{{- $gates := fromYaml (include "capabilities.gates" .) }}
{{- if and .Values.global.networkPolicy.enabled $components.operator.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name "tier" .Values.global.namespaceTier) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name) | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.global.networkPolicy.createEgressRules }}
    - Egress
  egress:
      # Container registries
    - ports:
        - port: 443
          protocol: TCP
      # Cloud Vendor detection (Instance Metadata Services)
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.169.254/32
    - ports:
        - protocol: TCP
          port: 8080
      to:
        - podSelector:
            matchLabels:
              {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.kubescape.name) | nindent 14 }}
    - ports:
        - protocol: TCP
          port: {{ .Values.kubevuln.service.targetPort }}
      to:
        - podSelector:
            matchLabels:
              {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.kubevuln.name) | nindent 14 }}
{{ tpl (.Files.Get "assets/api-server-egress-rules.yaml") . | indent 4 }}
{{ tpl (.Files.Get "assets/common-egress-rules.yaml") . | indent 4 }}
    {{- if eq $gates.effectiveCapabilities.sbomExport "enable" }}
    {{- $dtrack := urlParse .Values.sbomExport.dependencyTrack.url }}
    {{- $dtrackPort := ternary 80 443 (eq $dtrack.scheme "http") }}
    {{- if regexMatch ":[0-9]+$" $dtrack.host }}
    {{- $dtrackPort = int (regexFind "[0-9]+$" $dtrack.host) }}
    {{- end }}
    {{- $dtrackPorts := list }}
    {{- range prepend (.Values.sbomExport.dependencyTrack.egressPorts | default list) $dtrackPort }}
    {{- if and (ne (int .) 443) (not (has (int .) $dtrackPorts)) }}
    {{- $dtrackPorts = append $dtrackPorts (int .) }}
    {{- end }}
    {{- end }}
    {{- with $dtrackPorts }}
    # the SBOM export uploads to Dependency-Track; port 443 is already open above.
    - ports:
        {{- range . }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- with $.Values.sbomExport.dependencyTrack.egressTo }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- if $components.synchronizer.enabled }}
    # the operator posts admission alerts and registry-scan statuses to the synchronizer (httpExporterConfig).
    - to:
        - podSelector:
            matchLabels:
              {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.synchronizer.name) | nindent 14 }}
      ports:
        - port: {{ .Values.synchronizer.service.targetPort }}
          protocol: TCP
    {{- end }}
  {{- end }}
  {{- if eq .Values.capabilities.admissionController "enable" }}
  {{- $ingressFrom := .Values.operator.admissionWebhooks.networkPolicy.ingressFrom | default list }}
  ingress:
    # The kube-apiserver source address is not reliably constrainable by a Pod or
    # namespace selector, so by default this rule is unrestricted (no `from`).
    # operator.admissionWebhooks.networkPolicy.ingressFrom, when set, narrows it.
    - ports:
      - port: admission-port
        protocol: TCP
      {{- with $ingressFrom }}
      from:
        {{- /*
          Validate ipBlock.cidr. IPv4 is validated in full: each octet 0-255 and
          prefix 0-32. IPv6 (any value containing ":") is validated for charset
          (hex/colon) and prefix 0-128 — a regex cannot reliably parse full IPv6
          address structure, so the kube-apiserver remains the final authority on
          the address itself. Selector-only peers (no ipBlock) are not checked.
        */ -}}
        {{- $oct := "(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])" -}}
        {{- $v4pfx := "(3[0-2]|[12][0-9]|[0-9])" -}}
        {{- $v6pfx := "(12[0-8]|1[01][0-9]|[1-9]?[0-9])" -}}
        {{- $ipv4 := printf "^(%s[.]){3}%s/%s$" $oct $oct $v4pfx -}}
        {{- $ipv6 := printf "^[0-9A-Fa-f:]+/%s$" $v6pfx -}}
        {{- range $peer := . }}
        {{- if hasKey $peer "ipBlock" }}
        {{- $cidr := $peer.ipBlock.cidr | toString }}
        {{- $ok := ternary (regexMatch $ipv6 $cidr) (regexMatch $ipv4 $cidr) (contains ":" $cidr) }}
        {{- if not $ok }}
        {{- fail (printf "operator.admissionWebhooks.networkPolicy.ingressFrom: invalid ipBlock.cidr %q (want valid CIDR, e.g. 10.0.0.0/24 or 2001:db8::/64)" $cidr) }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
{{- end }}
