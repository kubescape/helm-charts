{{- $checksums := fromYaml (include "checksums" .) }}
{{- $components := fromYaml (include "components" .) }}
{{- $gates := fromYaml (include "capabilities.gates" .) }}
{{- if $components.operator.enabled }}
{{- $no_proxy_envar_list := (include "no_proxy_envar_list" .) -}}
{{- $offline := eq .Values.capabilities.kubescapeOffline "enable" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name "tier" .Values.global.namespaceTier) | nindent 4 }}
    kubescape.io/tier: "core"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    rollingUpdate:
      maxSurge: 0%
      maxUnavailable: 100%
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 8 }}
        {{- with .Values.operator.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
        checksum/operator-config: {{ $checksums.operatorConfig }}
        checksum/cloud-secret: {{ $checksums.cloudSecret }}
        checksum/cloud-config: {{ $checksums.cloudConfig }}
        checksum/capabilities-config: {{ $checksums.capabilitiesConfig }}
        checksum/matching-rules-config: {{ $checksums.matchingRulesConfig }}
      {{- if ne .Values.global.proxySecretFile "" }}
        checksum/proxy-config: {{ $checksums.proxySecret }}
      {{- end }}
      labels:
        {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name "tier" .Values.global.namespaceTier) | nindent 8 }}
        {{- with .Values.operator.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
        kubescape.io/tier: "core"
    spec:
      {{- if .Values.imagePullSecrets }}
      {{- include "kubescape-operator.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- if and (eq .Values.capabilities.admissionController "enable") (eq (include "kubescape.certificates.strategy" .) "initContainer") }}
      {{- $admissionName := include "kubescape-admission.name" . }}
      {{- $admissionSecret := include "kubescape-admission.secretName" . }}
      {{- $admissionHosts := printf "%s,%s" $admissionName (include "kubescape-admission.svcDomainName" .) }}
      {{- $certgenImage := printf "%s:%s" .Values.kubescapeOpsTool.image.repository (.Values.kubescapeOpsTool.image.tag | toString) }}
      initContainers:
        - name: certgen-create
          image: {{ $certgenImage }}
          imagePullPolicy: {{ .Values.kubescapeOpsTool.image.pullPolicy }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/usr/bin/kubescape-ops-tool", "certgen-create"]
          args:
            - --namespace
            - {{ .Values.ksNamespace }}
            - --secret-name
            - {{ $admissionSecret }}
            - --host
            - {{ $admissionHosts }}
            - --out-dir
            - /etc/certs
            - --ca-name
            - ca.crt
            - --cert-name
            - tls.crt
            - --key-name
            - tls.key
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/certs
            - name: tmp-dir
              mountPath: /tmp
        - name: certgen-patch
          image: {{ $certgenImage }}
          imagePullPolicy: {{ .Values.kubescapeOpsTool.image.pullPolicy }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/usr/bin/kubescape-ops-tool", "certgen-patch"]
          args:
            - --namespace
            - {{ .Values.ksNamespace }}
            - --secret-name
            - {{ $admissionSecret }}
            - --ca-name
            - ca.crt
            - --resource-type
            - vwc
            - --resource-name
            - {{ $admissionName }}
            - --retries
            - {{ .Values.operator.admissionWebhooks.patch.retries | quote }}
            - --retry-interval
            - {{ .Values.operator.admissionWebhooks.patch.retryIntervalSeconds | quote }}
      {{- end }}
      containers:
        - name: {{ .Values.operator.name }}
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: "trigger-port"
              containerPort: 4002
              protocol: TCP
            - name: "readiness-port"
              containerPort: 8000
              protocol: TCP
            {{- if eq .Values.capabilities.admissionController "enable" }}
            - name: "admission-port"
              containerPort: 8443
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/liveness
              port: readiness-port
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /v1/readiness
              port: readiness-port
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
{{ toYaml .Values.operator.resources | indent 12 }}
          env:
            {{- include "apiauth.serverEnv" . | nindent 12 }}
            - name: KS_API_TOKEN_FILE
              value: {{ include "apiauth.tokenFile" . | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HELM_RELEASE
              value: kubescape-operator-{{ .Chart.Version | replace "+" "_" }}
            {{- if .Values.operator.resources.limits.memory }}
            - name: GOMEMLIMIT
              value: {{ include "kubescape-operator.gomemlimit" (dict "memory" .Values.operator.resources.limits.memory "percentage" .Values.operator.gomemlimitPercentage) | quote }}
            {{- end }}
            - name: KS_LOGGER_LEVEL
              value: "{{ .Values.logger.level }}"
            - name: KS_LOGGER_NAME
              value: "{{ .Values.logger.name }}"
            {{- if $offline }}
            - name: KS_SKIP_UPDATE_CHECK
              value: "true"
            {{- end }}
            {{- range .Values.operator.env }}
            {{- if not (and $offline (eq .name "KS_SKIP_UPDATE_CHECK")) }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
            {{- end }}
            {{- if ne .Values.global.httpsProxy "" }}
            - name: HTTPS_PROXY
              value: "{{ .Values.global.httpsProxy }}"
            - name : no_proxy
              value: "{{ $no_proxy_envar_list }}"
            {{- end }}
            {{- if and (eq .Values.capabilities.admissionController "enable") .Values.operator.admissionWebhooks.clientAuth.enabled }}
            {{- if eq (.Values.operator.admissionWebhooks.clientAuth.secretName | default "") "" }}
            {{- fail "operator.admissionWebhooks.clientAuth.enabled=true requires operator.admissionWebhooks.clientAuth.secretName" }}
            {{- end }}
            {{- /*
              Compatibility guard. The operator image must read ADMISSION_CLIENT_CA_FILE and
              enforce client-certificate verification, otherwise this block mounts a CA and sets
              the env var while the webhook stays unauthenticated — an insecure silent no-op.
              The chart cannot verify an unreleased feature, so compatibility is ASSERTED by the
              operator, not checked by Helm. Enabling mTLS therefore requires BOTH:
                (a) clientAuth.operatorSupportsClientCA=true — an explicit operator attestation; and
                (b) operator.image.tag must not be a released version known NOT to read the variable.
              No released version reads it yet (kubescape/operator#522 is unmerged). The highest
              released version so verified is $maxKnownIncompatible; any SemVer tag whose
              major.minor.patch core is <= it is rejected even when attested — INCLUDING SemVer
              prereleases (v0.2.224-rc1, v0.2.223-custom): we compare the core, because
              Masterminds semverCompare excludes prereleases from a non-prerelease constraint and
              a prerelease of an incompatible release is itself incompatible. Non-SemVer tags
              (custom/dev builds from #522, git SHAs) are governed by the attestation alone. Raise
              $maxKnownIncompatible as further incompatible releases ship; once a release reads the
              variable, replace this with a minimum-supported-version check.
            */ -}}
            {{- if not .Values.operator.admissionWebhooks.clientAuth.operatorSupportsClientCA }}
            {{- fail "operator.admissionWebhooks.clientAuth.enabled=true requires an operator image that reads ADMISSION_CLIENT_CA_FILE and enforces client-certificate verification. No released operator image supports this yet (kubescape/operator#522 is not merged), and the chart's default operator.image.tag does not read the variable — enabling mTLS with it would leave the webhook unauthenticated while appearing secure. Build the operator from kubescape/operator#522 (or a later release that includes it), set operator.image.tag to that build, and set operator.admissionWebhooks.clientAuth.operatorSupportsClientCA=true to confirm the deployed image enforces client authentication. See docs/features/admission-webhook-mtls.md." }}
            {{- end }}
            {{- $maxKnownIncompatible := "0.2.240" }}
            {{- $tag := .Values.operator.image.tag | toString }}
            {{- /* The image renders as "<repository>:<tag>", so a digest-pinned image is expressed as
                   tag "<version>@sha256:<digest>". Split off that optional digest and version-check
                   only the tag before "@"; otherwise the anchored SemVer match below fails on the
                   suffix and a known-incompatible release (v0.2.224@sha256:...) is treated as a
                   custom tag and passes on attestation alone. A digest must be exactly
                   "sha256:" plus 64 lowercase hex characters (the OCI canonical form), and the
                   tag before it must be a non-empty valid image tag; anything else is rejected
                   rather than guessed at. The image reference itself is never rewritten. */ -}}
            {{- $version := $tag }}
            {{- if contains "@" $tag }}
            {{- $parts := splitList "@" $tag }}
            {{- if or (ne (len $parts) 2) (not (regexMatch "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$" (index $parts 0))) (not (regexMatch "^sha256:[a-f0-9]{64}$" (index $parts 1))) }}
            {{- fail (printf "operator.admissionWebhooks.clientAuth.enabled=true cannot be used with operator.image.tag=%q: a digest-pinned tag must have the form <tag>@sha256:<64 lowercase hex characters> (for example v0.2.241@sha256:<digest>), with a non-empty tag before the \"@\" so the mTLS compatibility check can read the operator version. Fix the tag or digest. See docs/features/admission-webhook-mtls.md." $tag) }}
            {{- end }}
            {{- $version = index $parts 0 }}
            {{- end }}
            {{- /* Match a full SemVer tag (optional v prefix, optional -prerelease and +build), then
                   compare its major.minor.patch core so prereleases are checked at their base version. */ -}}
            {{- if regexMatch "^v?[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?([+][0-9A-Za-z][0-9A-Za-z.-]*)?$" $version }}
            {{- $core := regexFind "[0-9]+[.][0-9]+[.][0-9]+" $version }}
            {{- if semverCompare (printf "<= %s" $maxKnownIncompatible) $core }}
            {{- fail (printf "operator.admissionWebhooks.clientAuth.enabled=true cannot be used with operator.image.tag=%q: every released operator version up to and including v%s is verified NOT to read ADMISSION_CLIENT_CA_FILE (kubescape/operator#522 is unmerged), so enabling mTLS with it would leave the webhook unauthenticated while appearing secure. A SemVer prerelease (e.g. -rc1) or a digest-pinned (@sha256:...) form of such a version is rejected too, at its %s base version. Set operator.image.tag to an operator build from kubescape/operator#522 (a non-SemVer custom/dev tag, or a release newer than v%s that includes it); operatorSupportsClientCA alone is not enough. See docs/features/admission-webhook-mtls.md." $tag $maxKnownIncompatible $core $maxKnownIncompatible) }}
            {{- end }}
            {{- end }}
            # Opt-in mutual TLS: the webhook verifies the API server's client cert
            # against this CA. Fail-closed — an unreadable CA stops the webhook.
            - name: ADMISSION_CLIENT_CA_FILE
              value: "/etc/admission-client-ca/{{ .Values.operator.admissionWebhooks.clientAuth.caKey }}"
            {{- end }}
          volumeMounts:
            {{- include "apiauth.callerVolumeMount" . | nindent 12 }}
            - name: {{ $components.cloudSecret.name }}
              mountPath: /etc/credentials
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp
            - name: {{ .Values.global.cloudConfig }}
              mountPath: /etc/config/clusterData.json
              readOnly: true
              subPath: "clusterData.json"
            - name: ks-capabilities
              mountPath: /etc/config/capabilities.json
              readOnly: true
              subPath: "capabilities.json"
            - name: {{ .Values.continuousScanning.configMapName }}
              mountPath: /etc/config/matchingRules.json
              readOnly: true
              subPath: "matchingRules.json"
            - name: config
              mountPath: /etc/config/config.json
              readOnly: true
              subPath: "config.json"
            {{- if and $components.nodeAgent.enabled .Values.nodeAgent.autoscaler.enabled }}
            - name: node-agent-template
              mountPath: /etc/templates
              readOnly: true
            {{- end }}
            {{- if .Values.global.overrideDefaultCaCertificates.enabled }}
            - name: custom-ca-certificates
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
            {{- end }}
            {{- if .Values.global.extraCaCertificates.enabled }}
            {{- range $key, $value := (lookup "v1" "Secret" .Values.ksNamespace .Values.global.extraCaCertificates.secretName).data }}
            - name: extra-ca-certificates
              mountPath: /etc/ssl/certs/{{ $key }}
              subPath: {{ $key }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.capabilities.admissionController "enable" }}
            - name: tls-certs
              mountPath: /etc/certs
              readOnly: true
            {{- if .Values.operator.admissionWebhooks.clientAuth.enabled }}
            - name: admission-client-ca
              mountPath: /etc/admission-client-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if eq $gates.effectiveCapabilities.sbomExport "enable" }}
            # a directory, not a subPath, so a rotated API key reaches the pod
            - name: sbom-export-api-key
              mountPath: /etc/sbom-export
              readOnly: true
            {{- end }}
{{- if .Values.volumeMounts }}
{{ toYaml .Values.volumeMounts | indent 12 }}
{{- end }}
{{- if .Values.operator.volumeMounts }}
{{ toYaml .Values.operator.volumeMounts | indent 12 }}
{{- end }}
{{- if ne .Values.global.proxySecretFile "" }}
            - name: proxy-secret
              mountPath: /etc/ssl/certs/proxy.crt
              subPath: proxy.crt
{{- end }}
      volumes:
        {{- include "apiauth.callerVolume" . | nindent 8 }}
        - name: {{ $components.cloudSecret.name }}
          secret:
            secretName: {{ $components.cloudSecret.name }}
        {{- if ne .Values.global.proxySecretFile "" }}
        - name: proxy-secret
          secret:
            secretName: {{ .Values.global.proxySecretName }}
        {{- end }}
        {{- if .Values.global.overrideDefaultCaCertificates.enabled }}
        - name: custom-ca-certificates
          secret:
            secretName: {{ $components.customCaCertificates.name }}
        {{- end }}
        {{- if .Values.global.extraCaCertificates.enabled }}
        - name: extra-ca-certificates
          secret:
            secretName: {{ .Values.global.extraCaCertificates.secretName }}
        {{- end }}
        {{- if eq .Values.capabilities.admissionController "enable" }}
        {{- if eq (include "kubescape.certificates.strategy" .) "initContainer" }}
        - name: tls-certs
          emptyDir: {}
        {{- else }}
        - name: tls-certs
          secret:
            secretName: {{ include "kubescape-admission.secretName" . }}
        {{- end }}
        {{- if .Values.operator.admissionWebhooks.clientAuth.enabled }}
        - name: admission-client-ca
          secret:
            secretName: {{ .Values.operator.admissionWebhooks.clientAuth.secretName | quote }}
        {{- end }}
        {{- end }}
        - name: tmp-dir
          emptyDir: {}
        - name: {{ .Values.global.cloudConfig }}
          configMap:
            name: {{ .Values.global.cloudConfig }}
            items:
            - key: "clusterData"
              path: "clusterData.json"
        - name: ks-capabilities
          configMap:
            name: ks-capabilities
            items:
              - key: "capabilities"
                path: "capabilities.json"
        - name: config
          configMap:
            name: {{ .Values.operator.name }}
            items:
            - key: "config.json"
              path: "config.json"
        - name: {{ .Values.continuousScanning.configMapName }}
          configMap:
            name: {{ .Values.continuousScanning.configMapName }}
            items:
              - key: "matchingRules.json"
                path: "matchingRules.json"
        {{- if and $components.nodeAgent.enabled .Values.nodeAgent.autoscaler.enabled }}
        - name: node-agent-template
          configMap:
            name: node-agent-daemonset-template
        {{- end }}
        {{- if eq $gates.effectiveCapabilities.sbomExport "enable" }}
        - name: sbom-export-api-key
          secret:
            secretName: {{ .Values.sbomExport.dependencyTrack.apiKeySecret.name }}
            items:
              - key: {{ .Values.sbomExport.dependencyTrack.apiKeySecret.key | quote }}
                path: api-key
        {{- end }}
{{- if .Values.volumes }}
{{ toYaml .Values.volumes | indent 8 }}
{{- end }}
{{- if .Values.operator.volumes }}
{{ toYaml .Values.operator.volumes | indent 8 }}
{{- end }}
      serviceAccountName: {{ .Values.operator.name }}
      automountServiceAccountToken: true
      nodeSelector:
      {{- if .Values.operator.nodeSelector }}
      {{- toYaml .Values.operator.nodeSelector | nindent 8 }}
      {{- else if .Values.customScheduling.nodeSelector }}
      {{- toYaml .Values.customScheduling.nodeSelector | nindent 8 }}
      {{- end }}
      affinity:
      {{- if .Values.operator.affinity }}
      {{- toYaml .Values.operator.affinity | nindent 8 }}
      {{- else if .Values.customScheduling.affinity }}
      {{- toYaml .Values.customScheduling.affinity | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.operator.tolerations }}
      {{- toYaml .Values.operator.tolerations | nindent 8 }}
      {{- else if .Values.customScheduling.tolerations }}
      {{- toYaml .Values.customScheduling.tolerations | nindent 8 }}
      {{- end }}
      {{- include "kubescape-operator.priorityClassName" (dict "component" .Values.operator "global" .Values.customScheduling) | nindent 6 }}
{{- end }}
