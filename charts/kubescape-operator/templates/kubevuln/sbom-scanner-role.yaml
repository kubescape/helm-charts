{{- $components := fromYaml (include "components" .) }}
{{- if and $components.kubevuln.enabled .Values.kubevuln.sbomScanner.enabled }}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.kubevuln.name }}-sbom-scanner
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.kubevuln.name "tier" .Values.global.namespaceTier) | nindent 4 }}
rules:
  # kubevuln reads its own pod's container statuses to tell an OOM-killed sidecar from a restarted one
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
{{- end }}
