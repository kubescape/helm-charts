{{- if and .Values.imagePullSecrets .Values.imagePullSecret.server .Values.imagePullSecret.username .Values.imagePullSecret.password }}
{{- $name := .Values.imagePullSecrets }}
{{- if kindIs "slice" $name }}
{{- $name = first $name }}
{{- end }}
{{- $creds := .Values.imagePullSecret }}
{{- $auth := dict "username" $creds.username "password" $creds.password "email" ($creds.email | default "") "auth" (printf "%s:%s" $creds.username $creds.password | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Values.ksNamespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $creds.server $auth) | toJson | b64enc }}
{{- end }}
