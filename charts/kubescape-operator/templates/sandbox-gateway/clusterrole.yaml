{{- if eq .Values.capabilities.sandboxGateway "enable" }}
# The only role that may write SandboxGatewayNodeStatus. Other roles in this
# chart never name the resource.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.sandboxGateway.name }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.sandboxGateway.name "tier" .Values.global.namespaceTier) | nindent 4 }}
rules:
- apiGroups: ["kubescape.io"]
  resources: ["sandboxgatewaynodestatuses"]
  verbs: ["get", "create"]
- apiGroups: ["kubescape.io"]
  resources: ["sandboxgatewaynodestatuses/status"]
  verbs: ["update"]
{{- end }}
