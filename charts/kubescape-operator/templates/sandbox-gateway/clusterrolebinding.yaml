{{- if eq .Values.capabilities.sandboxGateway "enable" }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.sandboxGateway.name }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.sandboxGateway.name "tier" .Values.global.namespaceTier) | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.sandboxGateway.name }}
  namespace: {{ .Values.ksNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.sandboxGateway.name }}
{{- end }}
