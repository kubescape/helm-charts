{{- $components := fromYaml (include "components" .) }}
{{- if and .Values.global.networkPolicy.enabled $components.kubescape.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.kubescape.name }}
  namespace: {{ .Values.ksNamespace }}
  annotations:
    {{- include "kubescape-operator.annotations" (dict "Values" .Values) | nindent 4 }}
  labels:
    {{- include "kubescape-operator.labels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.kubescape.name "tier" .Values.global.namespaceTier) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.kubescape.name) | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.global.networkPolicy.createEgressRules }}
    - Egress
  egress:
      # - backend api server
      # - GitRegoStore (https://github.com/kubescape/regolibrary/releases/)
    - ports:
        - port: 443
          protocol: TCP
      # Cloud Vendor detection (Instance Metadata Services)
    - ports:
        - port: 80
          protocol: TCP
      to:
        - ipBlock:
            cidr: 169.254.169.254/32
{{ tpl (.Files.Get "assets/api-server-egress-rules.yaml") . | indent 4 }}
{{ tpl (.Files.Get "assets/common-egress-rules.yaml") . | indent 4 }}
  {{- end }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kubescape-operator.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "app" .Values.operator.name) | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
    {{- if or .Values.kubescape.serviceMonitor.enabled (eq .Values.configurations.prometheusAnnotations "enable") }}
    {{- $scrapeFrom := .Values.kubescape.networkPolicy.prometheusIngressFrom | default list }}
    # Allow Prometheus to scrape metrics (ServiceMonitor or prometheus.io annotations).
    # The rule is unrestricted by default; kubescape.networkPolicy.prometheusIngressFrom,
    # when set, narrows it to the listed peers.
    - ports:
        - port: http
          protocol: TCP
      {{- with $scrapeFrom }}
      from:
        {{- /*
          Validate ipBlock.cidr. IPv4 is validated in full: each octet 0-255 and
          prefix 0-32. IPv6 (any value containing ":") is validated for charset
          (hex/colon, plus an optional validated IPv4-mapped dotted tail such as
          ::ffff:192.0.2.1) and prefix 0-128. A regex cannot reliably parse full
          IPv6 address structure, so the kube-apiserver remains the final authority
          on the address itself. Selector-only peers (no ipBlock) are not checked.
        */ -}}
        {{- $oct := "(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])" -}}
        {{- $v4pfx := "(3[0-2]|[12][0-9]|[0-9])" -}}
        {{- $v6pfx := "(12[0-8]|1[01][0-9]|[1-9]?[0-9])" -}}
        {{- $ipv4 := printf "^(%s[.]){3}%s/%s$" $oct $oct $v4pfx -}}
        {{- /* pure hex/colon IPv6 */ -}}
        {{- $ipv6hex := printf "^[0-9A-Fa-f:]+/%s$" $v6pfx -}}
        {{- /* IPv6 ending in a validated IPv4 dotted tail (each octet 0-255), e.g. ::ffff:192.0.2.1 */ -}}
        {{- $ipv6embed := printf "^[0-9A-Fa-f:]*:(%s[.]){3}%s/%s$" $oct $oct $v6pfx -}}
        {{- range $peer := . }}
        {{- if hasKey $peer "ipBlock" }}
        {{- $cidr := $peer.ipBlock.cidr | toString }}
        {{- $v6ok := or (regexMatch $ipv6hex $cidr) (regexMatch $ipv6embed $cidr) }}
        {{- $ok := ternary $v6ok (regexMatch $ipv4 $cidr) (contains ":" $cidr) }}
        {{- if not $ok }}
        {{- fail (printf "kubescape.networkPolicy.prometheusIngressFrom: invalid ipBlock.cidr %q (want valid CIDR, e.g. 10.0.0.0/24 or 2001:db8::/64)" $cidr) }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
