apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rules.kubescape.io
spec:
  group: kubescape.io
  names:
    kind: Rules
    listKind: RulesList
    plural: rules
    singular: rule
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                rules:
                  type: array
                  items:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: "Whether the rule is enabled"
                      id:
                        type: string
                        description: "Unique identifier for the rule"
                      name:
                        type: string
                        description: "Name of the rule"
                      description:
                        type: string
                        description: "Description of the rule"
                      expressions:
                        type: object
                        properties:
                          message:
                            type: string
                            description: "Message expression"
                          uniqueId:
                            type: string
                            description: "Unique identifier expression"
                          ruleExpression:
                            type: array
                            items:
                              type: object
                              properties:
                                eventType:
                                  type: string
                                  description: "Type of event this expression handles"
                                expression:
                                  type: string
                                  description: "The rule expression string"
                              required:
                                - eventType
                                - expression
                        required:
                          - message
                          - uniqueId
                          - ruleExpression
                      stateWrites:
                        type: array
                        description: >-
                          Facts this rule remembers across events, for
                          cross-event correlation. Each entry is driven by one
                          event type, which need not be an event type the rule
                          alerts on -- that is what allows a rule to remember on
                          exec and alert on network.
                        items:
                          type: object
                          properties:
                            eventType:
                              type: string
                              description: "Event stream that drives this write"
                            when:
                              type: string
                              description: "CEL boolean guard; empty means always write"
                            scope:
                              type: string
                              enum: ["container", "pod", "node", "identity"]
                              description: "Bucket the entry belongs to. identity is operator-only."
                            name:
                              type: string
                              description: "What kind of fact this is. A literal, never an expression."
                            key:
                              type: string
                              description: "CEL string expression naming the subject. Omit for a scope-wide fact."
                            value:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                              description: "Optional author extras as CEL expressions. Keys may not begin with an underscore."
                            ttl:
                              type: string
                              description: "Go duration string; clamped to the agent's configured maxTtl at load"
                          required:
                            - eventType
                            - scope
                            - name
                            - ttl
                      profileDependency:
                        type: integer
                        enum: [0, 1, 2]
                        description: "Profile dependency level (0=Required, 1=Optional, 2=NotRequired)"
                      profileDataRequired:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: "Per-rule profile fields required for rule-aware projection."
                      severity:
                        type: integer
                        description: "Severity level of the rule"
                      supportPolicy:
                        type: boolean
                        description: "Whether the rule supports rule policy enforcement"
                        default: false
                      tags:
                        type: array
                        items:
                          type: string
                        description: "Tags associated with the rule"
                      state:
                        type: object
                        additionalProperties: true
                        description: "State information for the rule"
                      agentVersionRequirement:
                        type: string
                        description: "Agent version requirement to evaluate this rule (supports semver ranges like ~1.0, >=1.2.0, etc.)"
                      isTriggerAlert:
                        type: boolean
                        description: "Whether the rule is a trigger alert"
                        default: true
                      mitreTechnique:
                        type: string
                        description: "MITRE technique associated with the rule"
                      mitreTactic:
                        type: string
                        description: "MITRE tactic associated with the rule"
                    required:
                      - enabled
                      - id
                      - name
                      - description
                      - expressions
                      - profileDependency
                      - severity
                      - supportPolicy
                      - isTriggerAlert
                      - mitreTechnique
                      - mitreTactic
              required:
                - rules
      subresources:
        status: {}
