suite: Storage ContainerProfile SQLite backend
set:
  unittest: true
  clusterName: test
capabilities:
  apiVersions:
    - batch/v1
tests:
  - it: renders neither key by default
    template: storage/configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.json"]
          pattern: containerProfileSqliteBackend
      - notMatchRegex:
          path: data["config.json"]
          pattern: containerProfileMigrationDryRun

  - it: renders the migration dry run
    template: storage/configmap.yaml
    set:
      storage.containerProfileMigrationDryRun: true
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"containerProfileMigrationDryRun": true,'
      - notMatchRegex:
          path: data["config.json"]
          pattern: containerProfileSqliteBackend

  - it: renders the backend with the single writer
    template: storage/configmap.yaml
    set:
      storage.containerProfileSqliteBackend: true
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"singleWriterEnabled": true,'
      - matchRegex:
          path: data["config.json"]
          pattern: '"containerProfileSqliteBackend": true,'
      - notMatchRegex:
          path: data["config.json"]
          pattern: containerProfileMigrationDryRun

  - it: renders valid JSON with the backend on
    template: storage/configmap.yaml
    set:
      storage.containerProfileSqliteBackend: true
      storage.sqliteBusyTimeout: ""
      storage.poolTimeout: ""
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"containerProfileSqliteBackend": true,\s+("tls|"serverBindPort)'

  - it: rejects the backend without the single writer
    set:
      storage.containerProfileSqliteBackend: true
      storage.singleWriterEnabled: false
    asserts:
      - failedTemplate:
          errorPattern: "storage.containerProfileSqliteBackend requires storage.singleWriterEnabled$"

  - it: rejects the backend together with the dry run
    set:
      storage.containerProfileSqliteBackend: true
      storage.containerProfileMigrationDryRun: true
    asserts:
      - failedTemplate:
          errorPattern: "storage.containerProfileMigrationDryRun cannot be combined with storage.containerProfileSqliteBackend: the dry run is taken before the backend is turned on$"

  - it: adds no startup probe by default
    template: storage/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: adds a startup probe for the migration dry run
    template: storage/deployment.yaml
    set:
      storage.containerProfileMigrationDryRun: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /livez
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 60

  - it: adds a configurable startup probe for the backend
    template: storage/deployment.yaml
    set:
      storage.containerProfileSqliteBackend: true
      storage.containerProfileMigrationStartupProbe.periodSeconds: 5
      storage.containerProfileMigrationStartupProbe.failureThreshold: 240
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 240
