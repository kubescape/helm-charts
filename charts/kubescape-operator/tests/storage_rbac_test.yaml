suite: Storage RBAC tests
templates:
  - storage/clusterrole.yaml
tests:
  - it: allows listing nodes to retain host resources while their nodes exist
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes"]
            verbs: ["list"]
