suite: Container capability tests
tests:
  - it: drops all capabilities on the kubescape container
    template: kubescape/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: drops all capabilities on the operator container
    template: operator/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: drops all capabilities on the storage apiserver container
    template: storage/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: drops all capabilities on the prometheus exporter container
    template: prometheus-exporter/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.prometheusExporter: enable
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: drops all capabilities on the kubescape scheduler container
    template: kubescape-scheduler/cronjob.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.continuousScan: disable
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: runs the grype-offline-db container with a read-only root filesystem and writable /tmp mount
    template: grype-offline-db/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      grypeOfflineDB.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp-dir
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp-dir
            emptyDir: {}

  - it: runs both operator admission certgen init containers with a read-only root filesystem
    template: operator/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      certificates.strategy: initContainer
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.readOnlyRootFilesystem
          value: true

  - it: mounts a writable /tmp for operator certgen-create's working directory
    template: operator/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      certificates.strategy: initContainer
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: certgen-create
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: tmp-dir
            mountPath: /tmp

  - it: disallows privilege escalation and pins group on node-agent sbom-scanner sidecar
    template: node-agent/daemonset.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.nodeSbomGeneration: enable
      nodeAgent.sbomScanner.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: sbom-scanner
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
