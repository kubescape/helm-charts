  - it: quotes a numeric-looking Secret name
    template: configs/image-pull-secret.yaml
    set:
      imagePullSecrets: "123"
      imagePullSecret.server: registry.example.com
      imagePullSecret.username: user
      imagePullSecret.password: pass
    asserts:
      - equal:
          path: metadata.name
          value: "123"

  - it: escapes quotes and backslashes in the generated .dockerconfigjson
    template: configs/image-pull-secret.yaml
    set:
      imagePullSecrets: regcred
      imagePullSecret.server: registry.example.com
      imagePullSecret.username: 'us"er'
      imagePullSecret.password: 'pa"ss\word'
    asserts:
      - equal:
          path: metadata.name
          value: regcred
      - equal:
          path: data[".dockerconfigjson"]
          decodeBase64: true
          value: '{"auths":{"registry.example.com":{"auth":"dXMiZXI6cGEic3Ncd29yZA==","email":"","password":"pa\"ss\\word","username":"us\"er"}}}'

  - it: keeps the email in the generated .dockerconfigjson
    template: configs/image-pull-secret.yaml
    set:
      imagePullSecrets: regcred
      imagePullSecret.server: quay.io
      imagePullSecret.username: foo
      imagePullSecret.password: bar
      imagePullSecret.email: foo@example.com
    asserts:
      - equal:
          path: data[".dockerconfigjson"]
          decodeBase64: true
          value: '{"auths":{"quay.io":{"auth":"Zm9vOmJhcg==","email":"foo@example.com","password":"bar","username":"foo"}}}'

  - it: names the generated Secret after the first entry when imagePullSecrets is a list
    template: configs/image-pull-secret.yaml
    set:
      imagePullSecrets:
        - regcred
        - other-existing-secret
      imagePullSecret.server: registry.example.com
      imagePullSecret.username: user
      imagePullSecret.password: 'p"w'
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: regcred
      - equal:
          path: data[".dockerconfigjson"]
          decodeBase64: true
          value: '{"auths":{"registry.example.com":{"auth":"dXNlcjpwInc=","email":"","password":"p\"w","username":"user"}}}'

  - it: lists every entry on the workloads when imagePullSecrets is a list and credentials are set
    template: kubescape/deployment.yaml
    set:
      imagePullSecrets:
        - regcred
        - other-existing-secret
      imagePullSecret.server: registry.example.com
      imagePullSecret.username: user
      imagePullSecret.password: pass
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: regcred
            - name: other-existing-secret

  - it: generates no Secret without credentials
    template: configs/image-pull-secret.yaml
    set:
      imagePullSecrets:
        - regcred
    asserts:
      - hasDocuments:
          count: 0

  - it: sets no imagePullSecrets by default
    template: kubescape/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
