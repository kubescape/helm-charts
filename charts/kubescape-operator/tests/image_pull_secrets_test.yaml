capabilities:
  apiVersions:
    - batch/v1
set:
  clusterName: kind-kind
  account: 9e6c0c2c-6bd0-4919-815b-55030de7c9a0
  accessKey: f304d73b-d43c-412b-82ea-e4c859493ce6
  server: api.example.com
  capabilities.autoUpgrading: enable
  capabilities.prometheusExporter: enable
  capabilities.vulnerabilityScan: enable
  capabilities.continuousScan: enable
  grypeOfflineDB.enabled: true
  grypeOfflineDB.image.tag: v6-latest
tests:
  - it: keeps a numeric-looking single name a string in kubescape/deployment.yaml
    template: kubescape/deployment.yaml
    set:
      imagePullSecrets: "123"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: "123"

