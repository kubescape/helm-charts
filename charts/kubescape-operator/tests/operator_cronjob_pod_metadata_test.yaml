suite: Operator CronJob templates pod annotations and labels
templates:
  - operator/ks-recurring-cronjob-configmap.yaml
  - operator/kv-recurring-cronjob-configmap.yaml
  - operator/registry-scan-recurring-cronjob-configmap.yaml
capabilities:
  apiVersions:
    - batch/v1
tests:
  - it: adds kubescapeScheduler.podAnnotations and podLabels to the pod template in operator/ks-recurring-cronjob-configmap.yaml
    template: operator/ks-recurring-cronjob-configmap.yaml
    set:
      kubescapeScheduler.podAnnotations:
        sidecar.istio.io/inject: "false"
      kubescapeScheduler.podLabels:
        team: platform
    asserts:
      - matchRegex:
          path: data.cronjobTemplate
          pattern: '\n {8}metadata:\n {10}annotations:\n {12}sidecar.istio.io/inject: "false"\n {10}labels:\n {12}team: platform\n {12}armo.tier: "kubescape-scan"\n'

  - it: keeps the default pod template metadata in operator/ks-recurring-cronjob-configmap.yaml
    template: operator/ks-recurring-cronjob-configmap.yaml
    asserts:
      - matchRegex:
          path: data.cronjobTemplate
          pattern: '\n {8}metadata:\n {10}labels:\n {12}armo.tier: "kubescape-scan"\n {12}kubescape.io/tier: "core"\n {8}spec:'

  - it: adds kubevulnScheduler.podAnnotations and podLabels to the pod template in operator/kv-recurring-cronjob-configmap.yaml
    template: operator/kv-recurring-cronjob-configmap.yaml
    set:
      kubevulnScheduler.podAnnotations:
        sidecar.istio.io/inject: "false"
      kubevulnScheduler.podLabels:
        team: platform
    asserts:
      - matchRegex:
          path: data.cronjobTemplate
          pattern: '\n {8}metadata:\n {10}annotations:\n {12}sidecar.istio.io/inject: "false"\n {10}labels:\n {12}team: platform\n {12}armo.tier: "vuln-scan"\n'

  - it: keeps the default pod template metadata in operator/kv-recurring-cronjob-configmap.yaml
    template: operator/kv-recurring-cronjob-configmap.yaml
    asserts:
      - matchRegex:
          path: data.cronjobTemplate
          pattern: '\n {8}metadata:\n {10}labels:\n {12}armo.tier: "vuln-scan"\n {12}kubescape.io/tier: "core"\n {8}spec:'

  - it: adds registryScanScheduler.podAnnotations and podLabels to the pod template in operator/registry-scan-recurring-cronjob-configmap.yaml
    template: operator/registry-scan-recurring-cronjob-configmap.yaml
    set:
      registryScanScheduler.podAnnotations:
        sidecar.istio.io/inject: "false"
      registryScanScheduler.podLabels:
        team: platform
    asserts:
      - matchRegex:
          path: data.cronjobTemplate
          pattern: '\n {8}metadata:\n {10}annotations:\n {12}sidecar.istio.io/inject: "false"\n {10}labels:\n {12}team: platform\n {12}armo.tier: "registry-scan"\n'

  - it: keeps the default pod template metadata in operator/registry-scan-recurring-cronjob-configmap.yaml
    template: operator/registry-scan-recurring-cronjob-configmap.yaml
    asserts:
      - matchRegex:
          path: data.cronjobTemplate
          pattern: '\n {8}metadata:\n {10}labels:\n {12}armo.tier: "registry-scan"\n {12}kubescape.io/tier: "core"\n {8}spec:'
