suite: admission webhook ingress restriction
templates:
  - operator/networkpolicy.yaml
tests:
  # 1. Existing default behavior: unrestricted ingress on the admission port.
  - it: leaves the admission ingress unrestricted by default
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.ingress[0].ports[0].port
          value: admission-port
      - equal:
          path: spec.ingress[0].ports[0].protocol
          value: TCP
      # 8. Correct port/protocol, and no source restriction by default.
      - notExists:
          path: spec.ingress[0].from

  # 2. Configured CIDR restriction.
  - it: restricts the admission ingress to a configured CIDR
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: 10.0.0.0/24
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: admission-port
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: 10.0.0.0/24
      - lengthEqual:
          path: spec.ingress[0].from
          count: 1

  # 3. Configured selector restriction.
  - it: restricts the admission ingress to a namespace selector
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    asserts:
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system

  # 7. Multiple ingress peers (CIDRs + selector) are all rendered.
  - it: renders multiple ingress peers
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: 10.0.0.0/24
        - ipBlock:
            cidr: 192.168.49.2/32
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    asserts:
      - lengthEqual:
          path: spec.ingress[0].from
          count: 3
      - equal:
          path: spec.ingress[0].from[1].ipBlock.cidr
          value: 192.168.49.2/32
      # 8. Port/protocol still correct alongside restrictions.
      - equal:
          path: spec.ingress[0].ports[0].port
          value: admission-port
      - equal:
          path: spec.ingress[0].ports[0].protocol
          value: TCP

  # 4. Admission controller disabled: no ingress rule for the webhook.
  - it: renders no admission ingress when the admission controller is disabled
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: disable
    asserts:
      - notExists:
          path: spec.ingress

  # 5. NetworkPolicy disabled: no policy document at all.
  - it: renders no policy when network policies are disabled
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      global.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # 6. CIDR validation: accepted values render, invalid values fail the template.
  - it: accepts a valid IPv4 CIDR
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: 10.0.0.0/24
    asserts:
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: 10.0.0.0/24

  - it: accepts a valid IPv6 CIDR
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: "::/64"
    asserts:
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: "::/64"

  - it: rejects an out-of-range IPv4 octet
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: 999.0.0.0/24
    asserts:
      - failedTemplate:
          errorMessage: 'operator.admissionWebhooks.networkPolicy.ingressFrom: invalid ipBlock.cidr "999.0.0.0/24" (want valid CIDR, e.g. 10.0.0.0/24 or 2001:db8::/64)'

  - it: rejects an all-out-of-range IPv4 address
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: 256.256.256.256/24
    asserts:
      - failedTemplate: {}

  - it: rejects an IPv4 prefix above 32
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: 10.0.0.0/33
    asserts:
      - failedTemplate: {}

  - it: rejects a grossly out-of-range IPv4 prefix
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: 10.0.0.0/99
    asserts:
      - failedTemplate: {}

  - it: rejects an IPv6 prefix above 128
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: "::/999"
    asserts:
      - failedTemplate: {}

  - it: rejects a CIDR with no prefix
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: 10.0.0.0
    asserts:
      - failedTemplate: {}

  - it: does not CIDR-check selector-only peers
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - podSelector:
            matchLabels:
              app: client
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels.app
          value: client

  - it: accepts a valid IPv6 network prefix
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: "2001:db8::/64"
    asserts:
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: "2001:db8::/64"

  - it: accepts an IPv4-mapped IPv6 host address
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: "::ffff:192.0.2.1/128"
    asserts:
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: "::ffff:192.0.2.1/128"

  - it: accepts an IPv4-mapped IPv6 subnet
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: "::ffff:192.0.2.0/120"
    asserts:
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: "::ffff:192.0.2.0/120"

  - it: accepts an IPv4-embedded IPv6 address with a non-mapped prefix
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: "2001:db8::192.0.2.1/128"
    asserts:
      - equal:
          path: spec.ingress[0].from[0].ipBlock.cidr
          value: "2001:db8::192.0.2.1/128"

  - it: rejects an IPv4-mapped IPv6 address with an out-of-range octet
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: "::ffff:999.0.2.1/128"
    asserts:
      - failedTemplate:
          errorMessage: 'operator.admissionWebhooks.networkPolicy.ingressFrom: invalid ipBlock.cidr "::ffff:999.0.2.1/128" (want valid CIDR, e.g. 10.0.0.0/24 or 2001:db8::/64)'

  - it: rejects an IPv4-mapped IPv6 address with an incomplete dotted tail
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.admissionController: enable
      operator.admissionWebhooks.networkPolicy.ingressFrom:
        - ipBlock:
            cidr: "::ffff:192.0.2/128"
    asserts:
      - failedTemplate:
          errorMessage: 'operator.admissionWebhooks.networkPolicy.ingressFrom: invalid ipBlock.cidr "::ffff:192.0.2/128" (want valid CIDR, e.g. 10.0.0.0/24 or 2001:db8::/64)'
