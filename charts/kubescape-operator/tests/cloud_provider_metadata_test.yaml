suite: Cloud provider metadata tests
tests:
  - it: renders inline AKS and GKE metadata as plain env values
    template: kubescape/deployment.yaml
    documentIndex: 0
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      cloudProviderMetadata:
        cloudRegion: eu-west-1
        gkeProject: gke-project-1
        aksSubscriptionID: sub-123
        aksResourceGroup: rg-1
        aksClientID: client-123
        aksClientSecret: client-secret-123
        aksTenantID: tenant-123
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KS_CLOUD_REGION
            value: eu-west-1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KS_GKE_PROJECT
            value: gke-project-1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZURE_SUBSCRIPTION_ID
            value: sub-123
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZURE_RESOURCE_GROUP
            value: rg-1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZURE_CLIENT_ID
            value: client-123
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZURE_CLIENT_SECRET
            value: client-secret-123
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZURE_TENANT_ID
            value: tenant-123

  - it: reads the metadata from the referenced secret when the key mappings are set
    template: kubescape/deployment.yaml
    documentIndex: 0
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      cloudProviderMetadata:
        cloudRegion: eu-west-1
        secretRef:
          name: kubescape-secret
          cloudRegionKey: cloudRegion
          subscriptionIdKey: aksSubscriptionID
          clientIdKey: aksClientID
          clientSecretKey: aksClientSecret
          tenantIdKey: aksTenantID
          resourceGroupKey: aksResourceGroup
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KS_CLOUD_REGION
            valueFrom:
              secretKeyRef:
                name: kubescape-secret
                key: cloudRegion
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZURE_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: kubescape-secret
                key: aksClientID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZURE_TENANT_ID
            valueFrom:
              secretKeyRef:
                name: kubescape-secret
                key: aksTenantID
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KS_CLOUD_REGION
            value: eu-west-1

  - it: renders no cloud metadata when secretRef is set without key mappings
    template: kubescape/deployment.yaml
    documentIndex: 0
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      cloudProviderMetadata:
        cloudRegion: eu-west-1
        secretRef:
          name: kubescape-secret
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KS_CLOUD_REGION
            value: eu-west-1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AZURE_CLIENT_ID
            value: ""

  - it: annotates the kubevuln ServiceAccount for Azure Workload Identity
    template: kubevuln/serviceaccount.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      cloudProviderMetadata:
        aksWorkloadIdentityClientID: 00000000-0000-0000-0000-000000000001
        aksWorkloadIdentityTenantID: 00000000-0000-0000-0000-000000000002
    asserts:
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: 00000000-0000-0000-0000-000000000001
      - equal:
          path: metadata.annotations["azure.workload.identity/tenant-id"]
          value: 00000000-0000-0000-0000-000000000002
      - notExists:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]

  - it: omits the Azure tenant annotation when no tenant ID is set
    template: kubevuln/serviceaccount.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      cloudProviderMetadata:
        aksWorkloadIdentityClientID: 00000000-0000-0000-0000-000000000001
    asserts:
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: 00000000-0000-0000-0000-000000000001
      - notExists:
          path: metadata.annotations["azure.workload.identity/tenant-id"]

  - it: labels the kubevuln pod for the Azure Workload Identity webhook
    template: kubevuln/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      cloudProviderMetadata:
        aksWorkloadIdentityClientID: 00000000-0000-0000-0000-000000000001
    asserts:
      - equal:
          path: spec.template.metadata.labels["azure.workload.identity/use"]
          value: "true"
      - notExists:
          path: metadata.labels["azure.workload.identity/use"]

  - it: does not enable Azure Workload Identity by default
    template: kubevuln/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - notExists:
          path: spec.template.metadata.labels["azure.workload.identity/use"]

  - it: keeps AWS IRSA precedence over Azure Workload Identity
    templates:
      - kubevuln/serviceaccount.yaml
      - kubevuln/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      cloudProviderMetadata:
        awsIamRoleArn: arn:aws:iam::123456789012:role/kubevuln
        aksWorkloadIdentityClientID: 00000000-0000-0000-0000-000000000001
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/kubevuln
        template: kubevuln/serviceaccount.yaml
      - notExists:
          path: metadata.annotations["azure.workload.identity/client-id"]
        template: kubevuln/serviceaccount.yaml
      - notExists:
          path: spec.template.metadata.labels["azure.workload.identity/use"]
        template: kubevuln/deployment.yaml
