suite: Posture record sweep RBAC
templates:
  - kubescape/clusterrole.yaml
tests:
  - it: lets the scanner list and delete its own posture records
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["spdx.softwarecomposition.kubescape.io"]
            resources: ["workloadconfigurationscans", "workloadconfigurationscansummaries"]
            verbs: ["create", "get", "update", "patch", "list", "delete"]
