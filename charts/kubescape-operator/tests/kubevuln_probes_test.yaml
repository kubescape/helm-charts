suite: kubevuln probe tests
tests:
  - it: keeps the default probe timings
    template: kubevuln/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /v1/liveness
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /v1/readiness
              port: 8080

  - it: renders custom probe timings
    template: kubevuln/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      kubevuln.livenessProbe:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      kubevuln.readinessProbe:
        timeoutSeconds: 5
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /v1/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /v1/readiness
              port: 8080
            timeoutSeconds: 5

  - it: keeps the probe handlers fixed and the other defaults when one field is set
    template: kubevuln/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      kubevuln.livenessProbe:
        timeoutSeconds: 5
        httpGet:
          path: /other
          port: 9999
        tcpSocket:
          port: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /v1/liveness
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 5

  - it: accepts a null liveness probe
    template: kubevuln/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      kubevuln.livenessProbe: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /v1/liveness
              port: 8080

  - it: drops terminationGracePeriodSeconds from the readiness probe
    template: kubevuln/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
      kubevuln.livenessProbe:
        terminationGracePeriodSeconds: 30
      kubevuln.readinessProbe:
        timeoutSeconds: 5
        terminationGracePeriodSeconds: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.terminationGracePeriodSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /v1/readiness
              port: 8080
            timeoutSeconds: 5
