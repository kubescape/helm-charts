suite: Operator image tag
tests:
  - it: pins an operator that carries the parent job id on the OperatorCommand path
    template: operator/deployment.yaml
    capabilities:
      apiVersions:
        - batch/v1
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/kubescape/operator:v0.2.197
