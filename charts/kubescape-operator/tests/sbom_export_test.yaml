suite: SBOM export to Dependency-Track
tests:
  - it: leaves the SBOM export out of the operator config by default
    template: operator/configmap.yaml
    capabilities:
      apiVersions: [batch/v1]
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - notMatchRegex:
          path: data["config.json"]
          pattern: '"sbomExport"'
  - it: gives the operator the Dependency-Track settings
    template: operator/configmap.yaml
    capabilities:
      apiVersions: [batch/v1]
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.sbomExport: enable
      sbomExport.resyncInterval: 30m
      sbomExport.dependencyTrack.url: https://dtrack.example.com
      sbomExport.dependencyTrack.apiKeySecret.name: dependency-track
      sbomExport.dependencyTrack.rootProject: prod
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"resyncInterval": "30m"'
      - matchRegex:
          path: data["config.json"]
          pattern: '"url": "https://dtrack.example.com"'
      - matchRegex:
          path: data["config.json"]
          pattern: '"apiKeyFile": "/etc/sbom-export/api-key"'
      - matchRegex:
          path: data["config.json"]
          pattern: '"rootProject": "prod"'
  - it: mounts the API key Secret as a directory, so a rotated key reaches the pod
    template: operator/deployment.yaml
    capabilities:
      apiVersions: [batch/v1]
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.sbomExport: enable
      sbomExport.dependencyTrack.url: https://dtrack.example.com
      sbomExport.dependencyTrack.apiKeySecret.name: dependency-track
      sbomExport.dependencyTrack.apiKeySecret.key: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sbom-export-api-key
            mountPath: /etc/sbom-export
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sbom-export-api-key
            secret:
              secretName: dependency-track
              items:
                - key: token
                  path: api-key
  - it: mounts nothing by default
    template: operator/deployment.yaml
    capabilities:
      apiVersions: [batch/v1]
    set:
      unittest: true
      clusterName: kind-kind
    asserts:
      - notMatchRegexRaw:
          pattern: sbom-export
  - it: refuses the export without a Dependency-Track URL
    capabilities:
      apiVersions: [batch/v1]
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.sbomExport: enable
      sbomExport.dependencyTrack.apiKeySecret.name: dependency-track
    asserts:
      - failedTemplate:
          errorMessage: capabilities.sbomExport=enable needs sbomExport.dependencyTrack.url, the base URL of the Dependency-Track API server.
  - it: refuses the export without an API key Secret
    capabilities:
      apiVersions: [batch/v1]
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.sbomExport: enable
      sbomExport.dependencyTrack.url: https://dtrack.example.com
    asserts:
      - failedTemplate:
          errorMessage: capabilities.sbomExport=enable needs sbomExport.dependencyTrack.apiKeySecret.name, an existing Secret in ksNamespace that holds the Dependency-Track API key.
  - it: warns that the export does nothing without nodeSbomGeneration
    template: configs/components-configmap.yaml
    capabilities:
      apiVersions: [batch/v1]
    set:
      unittest: true
      clusterName: kind-kind
      capabilities.sbomExport: enable
      capabilities.nodeSbomGeneration: disable
      sbomExport.dependencyTrack.url: https://dtrack.example.com
      sbomExport.dependencyTrack.apiKeySecret.name: dependency-track
    asserts:
      - matchRegex:
          path: data.capabilities
          pattern: '"effectiveCapabilities":\{[^}]*"sbomExport":"disable"'
      - matchRegex:
          path: data.capabilities
          pattern: 'capabilities.sbomExport=enable but capabilities.nodeSbomGeneration or capabilities.operator is not enabled'
  - it: opens egress to a Dependency-Track port other than 443
    template: operator/networkpolicy.yaml
    capabilities:
      apiVersions: [batch/v1]
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
      capabilities.sbomExport: enable
      sbomExport.dependencyTrack.url: http://dtrack-apiserver.dtrack.svc:8080
      sbomExport.dependencyTrack.apiKeySecret.name: dependency-track
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 8080
                protocol: TCP
  - it: adds no egress rule for Dependency-Track on 443, which is open already
    template: operator/networkpolicy.yaml
    capabilities:
      apiVersions: [batch/v1]
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
      capabilities.sbomExport: enable
      sbomExport.dependencyTrack.url: https://dtrack.example.com
      sbomExport.dependencyTrack.apiKeySecret.name: dependency-track
    asserts:
      - notMatchRegexRaw:
          pattern: Dependency-Track
