suite: Sandbox policy CRD lifecycle tests
tests:
- it: renders and retains ClusterSandboxPolicy by default
  template: sandbox-policy-crds/clustersandboxpolicy.crd.yaml
  release:
    name: policy-review
    namespace: policy-review-ns
  set:
    unittest: true
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: CustomResourceDefinition
  - isAPIVersion:
      of: apiextensions.k8s.io/v1
  - equal:
      path: metadata.name
      value: clustersandboxpolicies.kubescape.io
  - equal:
      path: spec.group
      value: kubescape.io
  - equal:
      path: spec.names.kind
      value: ClusterSandboxPolicy
  - equal:
      path: spec.scope
      value: Cluster
  - equal:
      path: spec.versions[0].name
      value: v1alpha1
  - equal:
      path: metadata.annotations["helm.sh/resource-policy"]
      value: keep
  - equal:
      path: metadata.annotations["meta.helm.sh/release-name"]
      value: policy-review
  - equal:
      path: metadata.annotations["meta.helm.sh/release-namespace"]
      value: policy-review-ns
  - equal:
      path: metadata.labels["app.kubernetes.io/managed-by"]
      value: Helm
  capabilities:
    apiVersions:
    - batch/v1
- it: renders and retains ClusterSandboxPolicy with storage, node-agent and host sensors
    disabled
  template: sandbox-policy-crds/clustersandboxpolicy.crd.yaml
  release:
    name: policy-review
    namespace: policy-review-ns
  set:
    unittest: true
    storage.enabled: false
    nodeAgent.config.hostSensor.enabled: false
    capabilities.relevancy: disable
    capabilities.runtimeObservability: disable
    capabilities.networkPolicyService: disable
    capabilities.runtimeDetection: disable
    capabilities.malwareDetection: disable
    capabilities.nodeProfileService: disable
    capabilities.seccompProfileService: disable
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: CustomResourceDefinition
  - isAPIVersion:
      of: apiextensions.k8s.io/v1
  - equal:
      path: metadata.name
      value: clustersandboxpolicies.kubescape.io
  - equal:
      path: spec.group
      value: kubescape.io
  - equal:
      path: spec.names.kind
      value: ClusterSandboxPolicy
  - equal:
      path: spec.scope
      value: Cluster
  - equal:
      path: spec.versions[0].name
      value: v1alpha1
  - equal:
      path: metadata.annotations["helm.sh/resource-policy"]
      value: keep
  - equal:
      path: metadata.annotations["meta.helm.sh/release-name"]
      value: policy-review
  - equal:
      path: metadata.annotations["meta.helm.sh/release-namespace"]
      value: policy-review-ns
  - equal:
      path: metadata.labels["app.kubernetes.io/managed-by"]
      value: Helm
  capabilities:
    apiVersions:
    - batch/v1
