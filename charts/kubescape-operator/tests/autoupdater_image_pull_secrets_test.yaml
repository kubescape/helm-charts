suite: Auto-updater CronJob image pull secrets
templates:
  - autoupdater/cronjob.yaml
tests:
  - it: uses a single imagePullSecrets name
    set:
      capabilities.autoUpgrading: enable
      imagePullSecrets: my-registry
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: my-registry

  - it: uses every name from an imagePullSecrets list
    set:
      capabilities.autoUpgrading: enable
      imagePullSecrets:
        - registry-a
        - registry-b
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: registry-a
            - name: registry-b

  - it: sets no imagePullSecrets by default
    set:
      capabilities.autoUpgrading: enable
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
