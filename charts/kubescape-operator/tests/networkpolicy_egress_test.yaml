suite: node-agent and kubevuln egress
templates:
  - node-agent/networkpolicy.yaml
  - kubevuln/networkpolicy.yaml
tests:
  - it: lets node-agent reach the synchronizer when it is enabled
    template: node-agent/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
      server: api.example
      account: 11111111-1111-1111-1111-111111111111
      accessKey: secret
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: kubescape-operator
                    app.kubernetes.io/instance: RELEASE-NAME
                    app.kubernetes.io/component: synchronizer
            ports:
              - port: 8089
                protocol: TCP
  - it: gives node-agent no synchronizer rule when the synchronizer is not installed
    template: node-agent/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
    asserts:
      - notMatchRegexRaw:
          pattern: synchronizer
  - it: lets kubevuln reach the API server like every other component
    template: kubevuln/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
      - notMatchRegexRaw:
          pattern: grype-offline-db
  - it: lets kubevuln reach a pinned API server address
    template: kubevuln/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
      global.networkPolicy.apiServerIP: 10.0.0.1
      global.networkPolicy.apiServerPort: 6443
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 6443
                protocol: TCP
            to:
              - ipBlock:
                  cidr: 10.0.0.1/32
  - it: lets kubevuln reach grype-offline-db when it is enabled
    template: kubevuln/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
      grypeOfflineDB.enabled: true
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: kubescape-operator
                    app.kubernetes.io/instance: RELEASE-NAME
                    app.kubernetes.io/component: grype-offline-db
            ports:
              - port: 8080
                protocol: TCP
  - it: keeps kubevuln egress out of the policy when egress rules are off
    template: kubevuln/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: false
      grypeOfflineDB.enabled: true
    asserts:
      - notExists:
          path: spec.egress
      - notMatchRegexRaw:
          pattern: grype-offline-db
  - it: derives proxy egress port from global.httpsProxy without invalid CIDR when IP is unset
    template: kubevuln/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
      global.httpsProxy: "http://proxy.corp.internal:3128"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 3128
                protocol: TCP
      - notMatchRegexRaw:
          pattern: "cidr: /32"
  - it: restricts proxy egress to pinned IP when global.networkPolicy.httpsProxyIP is set
    template: kubevuln/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
      global.httpsProxy: "http://10.0.0.1:8080"
      global.networkPolicy.httpsProxyIP: "10.0.0.1"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 8080
                protocol: TCP
            to:
              - ipBlock:
                  cidr: 10.0.0.1/32
  - it: defaults proxy egress port to 443 for https URLs without explicit port
    template: node-agent/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
      global.httpsProxy: "https://secure-proxy.corp.internal"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
      - notMatchRegexRaw:
          pattern: "cidr: /32"
  - it: allows explicit httpsProxyPort override
    template: node-agent/networkpolicy.yaml
    set:
      unittest: true
      clusterName: kind-kind
      global.networkPolicy.enabled: true
      global.networkPolicy.createEgressRules: true
      global.httpsProxy: "http://proxy.corp.internal:8080"
      global.networkPolicy.httpsProxyPort: 8888
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 8888
                protocol: TCP

