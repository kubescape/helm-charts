suite: Storage MCP endpoint config
set:
  unittest: true
  clusterName: test
capabilities:
  apiVersions:
    - batch/v1
tests:
  - it: leaves the MCP endpoint out by default
    template: storage/configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.json"]
          pattern: '"mcp"'

  - it: enables the endpoint with storage's default limits
    template: storage/configmap.yaml
    set:
      storage.mcp.enabled: true
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"mcp": \{"enabled":true\},'

  - it: passes the call timeout and response cap to storage
    template: storage/configmap.yaml
    set:
      storage.mcp.enabled: true
      storage.mcp.callTimeout: 45s
      storage.mcp.maxResponseBytes: 524288
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"mcp": \{"callTimeout":"45s","enabled":true,"maxResponseBytes":524288\},'

  - it: ignores the limits while the endpoint is off
    template: storage/configmap.yaml
    set:
      storage.mcp.callTimeout: 45s
      storage.mcp.maxResponseBytes: 524288
      storage.mcp.maxRunning: 2
      storage.mcp.maxWaiting: 0
      storage.mcp.maxWait: 45s
    asserts:
      - notMatchRegex:
          path: data["config.json"]
          pattern: '"mcp"'

  - it: refuses a call timeout without a unit
    set:
      storage.mcp.enabled: true
      storage.mcp.callTimeout: 30
    asserts:
      - failedTemplate:
          errorPattern: "storage.mcp.callTimeout must be a positive duration such as 30s, got 30$"

  - it: refuses a zero call timeout
    set:
      storage.mcp.enabled: true
      storage.mcp.callTimeout: 0s
    asserts:
      - failedTemplate:
          errorPattern: "storage.mcp.callTimeout must be a positive duration"

  - it: refuses a numeric zero call timeout
    set:
      storage.mcp.enabled: true
      storage.mcp.callTimeout: 0
    asserts:
      - failedTemplate:
          errorPattern: "storage.mcp.callTimeout must be a positive duration such as 30s, got 0$"

  - it: refuses a negative response cap
    set:
      storage.mcp.enabled: true
      storage.mcp.maxResponseBytes: -1
    asserts:
      - failedTemplate:
          errorPattern: "storage.mcp.maxResponseBytes must be a positive number of bytes, got -1$"

  - it: passes the admission limit to storage
    template: storage/configmap.yaml
    set:
      storage.mcp.enabled: true
      storage.mcp.maxRunning: 2
      storage.mcp.maxWaiting: 5
      storage.mcp.maxWait: 45s
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"mcp": \{"enabled":true,"maxRunning":2,"maxWait":"45s","maxWaiting":5\},'

  - it: passes maxWaiting 0, so no call waits for a slot
    template: storage/configmap.yaml
    set:
      storage.mcp.enabled: true
      storage.mcp.maxWaiting: 0
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"mcp": \{"enabled":true,"maxWaiting":0\},'

  - it: refuses a negative maxRunning
    set:
      storage.mcp.enabled: true
      storage.mcp.maxRunning: -1
    asserts:
      - failedTemplate:
          errorPattern: "storage.mcp.maxRunning must be a whole number of at least 1, got -1$"

  - it: refuses a fractional maxRunning
    set:
      storage.mcp.enabled: true
      storage.mcp.maxRunning: 1.5
    asserts:
      - failedTemplate:
          errorPattern: "storage.mcp.maxRunning must be a whole number of at least 1, got 1.5$"

  - it: refuses a negative maxWaiting
    set:
      storage.mcp.enabled: true
      storage.mcp.maxWaiting: -1
    asserts:
      - failedTemplate:
          errorPattern: "storage.mcp.maxWaiting must be a whole number of 0 or more, got -1$"

  - it: refuses a maxWait without a unit
    set:
      storage.mcp.enabled: true
      storage.mcp.maxWait: 30
    asserts:
      - failedTemplate:
          errorPattern: "storage.mcp.maxWait must be a positive duration such as 30s, got 30$"

  - it: refuses a zero maxWait
    set:
      storage.mcp.enabled: true
      storage.mcp.maxWait: 0
    asserts:
      - failedTemplate:
          errorPattern: "storage.mcp.maxWait must be a positive duration such as 30s, got 0$"
