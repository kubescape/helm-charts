{{- /*
DNS. Port-only on purpose: the cluster resolver is not always a kube-dns pod in kube-system
(NodeLocal DNSCache listens on a link-local host-network address, OpenShift runs it in
openshift-dns), and selectors would silently break name resolution there.
*/ -}}
- ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
{{- if ne .Values.global.httpsProxy "" }}
- ports:
    - port: {{ .Values.global.networkPolicy.httpsProxyPort }}
      protocol: TCP
  to:
    - ipBlock:
        cidr: {{ .Values.global.networkPolicy.httpsProxyIP }}/32
{{- end }}