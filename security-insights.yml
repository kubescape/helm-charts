header:
  schema-version: 2.2.0
  last-updated: '2026-10-28'
  last-reviewed: '2026-10-28'
  url: https://raw.githubusercontent.com/kubescape/helm-charts/main/security-insights.yml

project:
  name: Kubescape
  administrators:
    - name: Matthias Bertschy
      social: https://github.com/matthyx
      primary: true
    - name: Ben Hirschberg
      social: https://github.com/slashben
      primary: false
    - name: Rotem Refael
      social: https://github.com/rotemamsa
      primary: false
    - name: Amir Malka
      social: https://github.com/amirmalka
      primary: false
    - name: Bezalel Brandwine
      social: https://github.com/Bezbran
      primary: false
  repositories:
    - name: helm-charts
      url: https://github.com/kubescape/helm-charts
      comment: Helm chart that installs the Kubescape operator and in-cluster components.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    policy: https://github.com/kubescape/project-governance/blob/main/SECURITY.md
    contact:
      name: Kubescape maintainers
      email: cncf-kubescape-maintainers@lists.cncf.io
      primary: true
  documentation:
    detailed-guide: https://kubescape.io/docs/
    code-of-conduct: https://github.com/kubescape/project-governance/blob/main/CODE_OF_CONDUCT.md
    quickstart-guide: https://kubescape.io/docs/getting-started/

repository:
  url: https://github.com/kubescape/helm-charts
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: Matthias Bertschy
      social: https://github.com/matthyx
      primary: true
    - name: Ben Hirschberg
      social: https://github.com/slashben
      primary: false
    - name: Rotem Refael
      social: https://github.com/rotemamsa
      primary: false
    - name: Amir Malka
      social: https://github.com/amirmalka
      primary: false
    - name: Bezalel Brandwine
      social: https://github.com/Bezbran
      primary: false
  license:
    url: https://github.com/kubescape/helm-charts/blob/main/LICENSE
    expression: Apache-2.0
  documentation:
    contributing-guide: https://github.com/kubescape/project-governance/blob/main/CONTRIBUTING.md
    governance: https://github.com/kubescape/project-governance/blob/main/GOVERNANCE.md
    security-policy: https://github.com/kubescape/project-governance/blob/main/SECURITY.md
    review-policy: https://github.com/kubescape/project-governance/blob/main/CONTRIBUTING.md#requirements-for-contributions
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://kubescape.github.io/helm-charts/
        comment: Helm repository.
      - uri: https://github.com/kubescape/helm-charts/releases
        comment: Chart packages (.tgz).
    attestations:
      - name: SLSA build provenance
        location: https://github.com/kubescape/helm-charts/attestations
        predicate-uri: https://slsa.dev/provenance/v1
        comment: Generated for each chart package by the release workflow. Verify with `gh attestation verify <chart>.tgz --repo kubescape/helm-charts`.
  security:
    assessments:
      self:
        evidence: https://github.com/kubescape/kubescape/blob/master/docs/security/self-assessment.md
        comment: Project-wide Kubescape self-assessment, maintained in kubescape/kubescape.
    tools:
      - name: OpenSSF Scorecard
        type: other
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results: {}
        comment: Runs weekly and on every push to main.
      - name: OSPS Baseline Action
        type: other
        rulesets:
          - osps-baseline-2026-08
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: OSPS Baseline scan
            predicate-uri: https://github.com/revanite-io/osps-baseline-action
            location: https://github.com/kubescape/helm-charts/actions/workflows/osps-baseline.yml
        comment: Runs on every push to the default branch and weekly.
